    // Starfield's ink share fell from 51.1% to 35.7% on a 4x canvas, and this
    // comment said depth scaling fixed it. Neither part survived: that figure
    // counted every non-black pixel, which in this style is mostly the nebula
    // haze, whose discs are placed at random and vary more between RUNS than
    // between canvas sizes. Counting only pixels bright enough to be a star, the
    // falloff is 0.84 before and 0.82 after — unchanged.
    //
    // What the depth scaling DID do is worth more anyway: star ink roughly
    // DOUBLED at both sizes, 0.44% -> 0.91%, because a near star is large. The
    // sky is fuller, not less prone to emptying.
    const depth=s=>s.z?Math.min(3.4,0.34/s.z+0.22):1;
    const star=(s,base,c0)=>{
      const tw=base+twAmp*Math.sin(t*s.sp+s.ph);
      const d=Math.abs(s.y-bandY)/bandW;
      const lit=level*Math.max(0,1-d*d);            // gaussian-ish band at pitch height
      const c=lit>0.02?mix(c0,col,Math.min(1,lit*1.5)):c0;
      const dp=depth(s);
      const a=Math.min(1,vI()*(tw+lit*0.9)*Math.min(1,0.45+0.55*dp));
      const r=s.r*(1+lit*1.6)*dp;
      ctx.fillStyle=rgba(c,a);
      ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.fill();
      if(lit>0.25||(s.mem&&a>0.4)){                  // cross-sparkle on bright stars
        ctx.strokeStyle=rgba(c,a*0.5); ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(s.x-r*3,s.y); ctx.lineTo(s.x+r*3,s.y);
        ctx.moveTo(s.x,s.y-r*3); ctx.lineTo(s.x,s.y+r*3);
        ctx.stroke();
      }
    };
    // A STAR TAKES ITS COLOUR FROM THE THEME. They were drawn white and only
    // mixed toward the palette where the voice band lit them, so changing theme
    // moved almost nothing — the user: "the changes in colour themes are very
    // subtle". Each star now keeps its own place in the palette, still pale
    // enough to read as a star rather than a coloured dot.
    for(const s of stars)
      star(s,0.14,SETTINGS.colorMode==='theme'
        ?mix(palAt(s.hue===undefined?0.5:s.hue),[255,255,255],0.45)
        :mix(col,[255,255,255],0.45));
    // memory stars: every sharp sound adds NEW coloured stars — the session
    // literally builds this student's sky
    for(const s of memStars) star(s,0.30,s.c);
    const hit=onset();

    // ── PASSING DUST ──
    // These used to be RISING SPARKS: particles that drifted up from the floor
    // of the sky while there was sound. They were added in UAT round 1 because a
    // sustained note had nothing to do here — and once the sky started flying,
    // they were the only things in it moving the wrong way. The user: "the
    // rising sparks coming from below are not needed, maybe they could be
    // incorporated into the flying through space."
    //
    // So they are the same idea inside the same geometry: a sound throws coloured
    // dust into the field, and it flies past with everything else. Same slider,
    // renamed to what it now is — the KEY stays `sparks`, so a therapist who had
    // already turned this down keeps their setting rather than silently getting
    // it back at full.
    // "I can't really see the passing dust." It was emitted at 16/s, at a
    // star's size, and born at z 0.55..1 — far away, small and dim, in a field
    // that had just gained 300 stars to hide it among. It is 3x the rate, twice
    // the size, drawn at full brightness rather than 0.7, and born NEAR
    // (z 0.30..0.75) so it is already large when it appears and sweeps past
    // quickly. It is the one thing here that is purely the student's own sound.
    emitAcc+=dt*level*48*tw('sparks');
    while(emitAcc>=1&&sparks.length<260){
      emitAcc--;
      const sd=starSeed();
      sparks.push({dust:true, dx:sd.dx*0.75, dy:sd.dy*0.75, z:0.30+Math.random()*0.45,
        x:0, y:0,
        size:(1.8+Math.random()*2.6)*(H/800),
        c:SETTINGS.colorMode==='theme'?palAt(Math.random()):mix(col,[255,255,255],0.3),
        life:1+Math.random()*0.7, keep:false});
    }
    emitAcc=Math.min(emitAcc,4);

    // ── A LOUD SOUND SCATTERS SKY THAT STAYS ──
    // The user's idea of crossing Fireworks with Starfield, done the way round
    // that suits this style: the burst does not fall and burn out, it slows to a
    // stop and about a third of it BECOMES stars. So a shout leaves something
    // behind, which is what the memory-star comment above always claimed and
    // what one star per sound never really showed.
    if(hit&&sparks.length<180){
      const bx=W*(0.1+0.8*Math.random()), by=voiceY(H);
      const n=(7+level*11)|0, sp=Math.min(W,H)*(0.05+0.14*level);
      for(let i=0;i<n;i++){
        const ang=Math.random()*Math.PI*2, v=sp*(0.25+0.75*Math.random());
        sparks.push({x:bx,y:by,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,
          size:(1.0+Math.random()*1.8)*(H/800),
          c:SETTINGS.colorMode==='theme'?palAt(Math.random()):mix(col,[255,255,255],Math.random()*0.4),
          life:1, keep:Math.random()<0.35, burst:true});
      }
    }
    const slow=Math.min(W,H)*0.012;
    sparks=sparks.filter(s=>{
      if(s.dust){                       // dust rides the field, like a star
        s.z-=dz;
        s.life-=dt*0.30;
        if(s.life<=0||s.z<=STAR_ZMIN) return false;
        s.x=cx+s.dx*W/s.z; s.y=cy+s.dy*H/s.z;
        if(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30) return false;
        const dp=Math.min(3.4,0.34/s.z+0.22);
        ctx.fillStyle=rgba(s.c,Math.min(1,vI()*Math.min(1,s.life*1.25)));
        ctx.beginPath(); ctx.arc(s.x,s.y,s.size*dp,0,Math.PI*2); ctx.fill();
        return true;
      }
      const drag=s.burst?Math.pow(0.05,dt):Math.pow(0.9,dt);
      s.vx*=drag; s.vy*=drag;
      s.x+=s.vx*dt; s.y+=s.vy*dt;
      s.life-=dt*(s.burst?0.45:0.3);
      if(s.burst&&Math.hypot(s.vx,s.vy)<slow){
        if(s.keep){                                  // it has come to rest as a star
          // Join the field WHERE IT IS: solve the projection backwards so the
          // star does not jump on the frame it is created. Without this a burst
          // settled and then leapt to wherever z=0.55 happened to put it.
          const zz=0.55;
          memStars.push({x:s.x,y:s.y,r:s.size*0.9,ph:Math.random()*Math.PI*2,
            sp:0.3+Math.random()*1.2,c:s.c,mem:true,z:zz,
            dx:(s.x-cx)/W*zz, dy:(s.y-cy)/H*zz});
          while(memStars.length>mCap) memStars.shift();
          return false;
        }
        s.burst=false;                               // the rest drift off as sparks
        s.vy=-H*0.02;
      }
      if(s.life<=0||s.y<-20||s.y>H+30) return false;
      ctx.fillStyle=rgba(s.c,Math.min(1,vI()*s.life*0.7));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
      return true;
    });

    // shooting stars: the cap was 3, which on a talkative student meant most
    // sounds produced none at all
    if(hit&&shoots.length<6){
      const fromLeft=Math.random()<0.5;
      shoots.push({x:fromLeft?-40:W+40,y:H*(0.05+0.45*Math.random()),
        vx:(fromLeft?1:-1)*W*(0.6+0.5*Math.random()),vy:H*(0.06+0.10*Math.random()),
        life:1,c:col.slice()});
    }
    shoots=shoots.filter(s=>{
      const px=s.x,py=s.y;
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt*0.7;
      if(s.life<=0||s.x<-80||s.x>W+80) return false;
      const grad=ctx.createLinearGradient(px-s.vx*0.12,py-s.vy*0.12,s.x,s.y);
      grad.addColorStop(0,rgba(s.c,0)); grad.addColorStop(1,rgba(mix(s.c,[255,255,255],0.6),s.life*0.9));
      ctx.strokeStyle=grad; ctx.lineWidth=Math.max(1.5,H*0.003); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(px-s.vx*0.12,py-s.vy*0.12); ctx.lineTo(s.x,s.y); ctx.stroke();
      return true;
    });
  }

  // ── 🟩 Pixels: the whole screen is a coarse pixel grid (count set by the
  //    "Pixels across" slider) running a heat simulation. The voice is a heat
  //    source — loudness sets intensity, pitch sets height — and heat blooms
  //    outward cell by cell, then cools. In silence the grid idles as a faint
  //    breathing mosaic of the theme; heat slides each cell's colour up the
  //    palette towards the hot end, white-hot at the core. Flat rects — cheap. ──
  function pixCols(){ return Math.max(8,Math.round(30*tw('px'))); }
  function initPix(W,H){
    const cols=pixCols(), s=W/cols, rows=Math.max(2,Math.ceil(H/s));
    pix={W,H,cols,rows,s,heat:new Float32Array(cols*rows),
      tmp:new Float32Array(cols*rows),sx:cols/2,hot:false};
  }
  // Pour heat into the grid around cell (cx,cy) with a soft gaussian edge.
  function pixHeat(cx,cy,rad,amt){
    const P=pix, r2=rad*rad;
    const x0=Math.max(0,(cx-rad)|0), x1=Math.min(P.cols-1,Math.ceil(cx+rad));
    const y0=Math.max(0,(cy-rad)|0), y1=Math.min(P.rows-1,Math.ceil(cy+rad));
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      const d2=(x-cx)*(x-cx)+(y-cy)*(y-cy);
      if(d2>r2) continue;
      const i=y*P.cols+x;
      P.heat[i]=Math.min(1.25,P.heat[i]+amt*Math.exp(-d2/(r2*0.35)));
    }
  }
  function drawPixels(W,H,dt){
    if(!pix||pix.W!==W||pix.H!==H||pix.cols!==pixCols()) initPix(W,H);
    const P=pix, C=P.cols, R=P.rows, s=P.s, sc=Math.sqrt(C/30);
    // the source wanders slowly left-right so a session paints the whole screen
    const wx=C*(0.5+0.30*Math.sin(t*0.11)+0.14*Math.sin(t*0.043+2));
    P.sx+=(wx-P.sx)*(1-Math.exp(-dt/1.5));
    if(level>0.02)
      pixHeat(P.sx,voiceY(H)/s,(1.2+3.4*level)*sc,dt*(3+24*level));
    if(onset()) pixHeat(P.sx,voiceY(H)/s,(2.6+2.5*level)*sc,0.55);  // pop = splash
    // diffuse to the four neighbours, then cool (afterglow = how long heat lives)
    const heat=P.heat, tmp=P.tmp;
    const k=Math.min(0.42,dt*5.5*tw('spread'));
    const cool=Math.exp(-dt/(6.5*tw('linger')));
    for(let y=0;y<R;y++) for(let x=0;x<C;x++){
      const i=y*C+x, h=heat[i];
      const nb=heat[i-(x>0?1:0)]+heat[i+(x<C-1?1:0)]+heat[i-(y>0?C:0)]+heat[i+(y<R-1?C:0)];
      let v=(h+k*(nb*0.25-h))*cool-dt*0.012;
      tmp[i]=v>0?v:0;
    }
    P.heat=tmp; P.tmp=heat;
    // render: every cell, every frame — the screen IS the grid
    const themeMode=SETTINGS.colorMode==='theme';
    const gap=Math.max(1,s*0.06), tri=v=>{ v%=2; return v<1?v:2-v; };
    let mx=0;
    for(let y=0;y<R;y++) for(let x=0;x<C;x++){
      const h=tmp[y*C+x]; if(h>mx) mx=h;
      const hv=Math.min(1,h);
      // resting palette position: slow diagonal sweep so silence still shows
      // the full theme as a breathing mosaic
      const g0=tri(x*0.6/(C-1)+y*0.4/(R-1)+t*0.008);
      let c;
      if(themeMode){
        // thermal-camera reading of the theme: as a cell heats up its colour
        // sweeps THROUGH the palette towards the hot end, so every bloom wears
        // the full theme as rings; only overdriven cores flash white below
        const w=Math.pow(hv,0.7);
        c=palAt(g0+(hv-g0)*w);
      } else c=mix(col,[255,255,255],hv*0.4);
      if(h>1) c=mix(c,[255,255,255],Math.min(0.4,(h-1)*1.6));  // white-hot core
      const idle=0.05*(0.75+0.25*Math.sin(t*0.6+(x+y)*0.7));
      ctx.fillStyle=rgba(c,Math.min(1,vI()*(idle+0.92*Math.pow(hv,0.9))));
      ctx.fillRect(x*s+gap*0.5,y*s+gap*0.5,s-gap,s-gap);
    }
    P.hot=mx>0.015;
  }

  // ── 💡 LEDs: the sensory-room LED wall, in software. The WHOLE SCREEN is a
  //    grid of LEDs; the chase runs around the outer rectangle and around every
  //    rectangle inside it, working toward the centre. ──
  //
  // THIS REPLACES SIX SEPARATE PATTERNS, and the user is right that it is better:
  // "I don't like the mixture of styles. What about a full grid of LEDs that
  // cover the whole screen and the chase around the outside, is on every
  // internal rectangle as you move to the centre." Six unrelated effects behind
  // a slider is a menu; this is one idea with controls that all act on it.
  //
  // Every LED belongs to exactly one concentric rectangle — its RING, the
  // distance to the nearest edge in grid steps — and to one position around that
  // ring's perimeter. The chase is a hotspot travelling around each ring at
  // once; `Spiral` offsets each ring's phase from the one outside it, so at 0
  // the hotspots line up into a pulse breathing inward and at 2 they trail into
  // a spiral. Each ring also carries one frequency band, low at the edge and
  // high at the centre, so a voice lights the wall from the outside in.
  function drawLeds(W,H,dt){
    const m=Math.min(W,H);
    const sp=Math.max(14,(m/30*tw('size'))|0);
    const cols=Math.max(5,Math.round(W/sp)), rows=Math.max(5,Math.round(H/sp));
    const cw=W/cols, ch=H/rows, rad=Math.min(cw,ch)*0.30;
    const nRings=Math.max(1,Math.ceil(Math.min(cols,rows)/2));
    updateBands(nRings,dt);
    ledChase=(ledChase+dt*(0.12+0.85*level)*tw('chase'))%1;
    // a transient is a wave that runs inward across the rings
    if(onset()&&ledPulses.length<5) ledPulses.push({r:-0.6,life:1});
    ledPulses=ledPulses.filter(p=>{ p.r+=dt*nRings*1.5; p.life-=dt*0.65;
      return p.life>0&&p.r<nRings+1.5; });
    // AT `Chase speed` 0 THE CHASE IS OFF, not frozen. It used to stop advancing
    // and keep lighting, so the bottom of the slider left a ring of stationary
    // bright dots on every rectangle — which is not what a speed of zero means,
    // and not what the other sliders that reach 0 in this app do (`Sound spread`,
    // `Passing dust`, the old `Equalizer height`). Zero is off.
    const chaseAmt=tw('chase');
    const spiral=tw('spiral')*0.10, spread=tw('spectrum');
    for(let gy=0;gy<rows;gy++) for(let gx=0;gx<cols;gx++){
      const ring=Math.min(gx,gy,cols-1-gx,rows-1-gy);
      const w=cols-2*ring, h=rows-2*ring;
      const per=Math.max(1,2*(w+h)-4);          // LEDs around this rectangle
      // where this LED sits around its own rectangle, clockwise from top-left
      let u;
      if(gy===ring)                u=gx-ring;
      else if(gx===cols-1-ring)    u=(w-1)+(gy-ring);
      else if(gy===rows-1-ring)    u=(w-1)+(h-1)+(cols-1-ring-gx);
      else                         u=(w-1)+(h-1)+(w-1)+(rows-1-ring-gy);
      const t01=per>1?u/per:0;
      const head=((ledChase-ring*spiral)%1+1)%1;
      let d=Math.abs(t01-head); d=Math.min(d,1-d);
      let b=0.045;                              // the wall is visible at rest
      if(chaseAmt>0.001) b+=0.85*Math.max(0,1-d*per/3.0);   // hotspot, ~3 LEDs wide
      const v=bands?bands[Math.min(nRings-1,ring)]:0;
      b+=0.8*Math.pow(v,0.8)*spread;            // this ring's own band
      for(const pu of ledPulses) b+=pu.life*Math.max(0,1-Math.abs(ring-pu.r)/1.4);
      b=Math.min(1,b)*vI();
      const c=SETTINGS.colorMode==='theme'?palAt(nRings>1?ring/(nRings-1):0.5):col;
      ctx.fillStyle=rgba(b>0.75?mix(c,[255,255,255],(b-0.75)*1.6):c,0.10+0.88*b);
      ctx.beginPath();
      ctx.arc((gx+0.5)*cw,(gy+0.5)*ch,rad*(1+0.5*b),0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawTouchRings(W,H,dt){
    touchRings=touchRings.filter(g=>{
      g.r+=g.v*dt; g.a*=Math.pow(0.2,dt);
      if(g.a<0.01) return false;
      ctx.strokeStyle=rgba(g.c,g.a);
      ctx.lineWidth=Math.max(2,H*0.006);
      ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,Math.PI*2); ctx.stroke();
      return true;
    });
  }

    // Touch behaves like the voice for the current style (silent, but the same
    // visual language): seed a pixel colony, stir the lava, pour particles…
    // Styles where position has no meaning fall back to a soft touch ring.
    // A TAP IS WORTH A SHOUT. Every one of these was quietly weaker than what
    // the voice produces at level 1 — Fireworks gave a tap 18 particles at
    // 0.30m against the voice's 80 at 0.72m, Ripples 0.55 against 1.0, Mandala
    // 0.7, Lava 0.6, Starfield a single star against a whole scatter. A student
    // who cannot vocalise yet, or a therapist demonstrating what a sound will
    // do, was being shown a smaller version of the activity. There is no reason
    // for that: the tap IS the deliberate act. Reported in UAT round 3 as
    // "clicking explosions should be the same strength as the settings/voice".
    splat(x,y,dx,dy,color){
      const W=canvas.width, H=canvas.height, m=Math.min(W,H);
      const X=x*W, Y=(1-y)*H, mode=SETTINGS.visMode, now=performance.now();
      const c=color.map(v=>Math.min(1,v)*255);
      const act=ms=>{ if(now-lastTouchAct<ms) return false; lastTouchAct=now; return true; };
      if(mode==='mandala'){    // pour energy into the spectrum bars at the finger's angle
        const cx=W/2, cy=H/2, r0=m*0.13, d=Math.hypot(X-cx,Y-cy);
        if(d<r0*1.05){ if(act(180)) mandBurst(1); }          // centre → the whole ring flares out
        else mandTouch(Math.atan2(Y-cy,X-cx),1,2,Math.max(0,d-r0));    // finger → beam stretches out to the touch
        pokeSim();
        return;
      }
      if(mode==='lava'){       // snooker strike: a crisp hit sends the blob away,
        for(const b of blobs){ // friction (in drawLava) rolls it back to a drift
          const d=Math.hypot(b.x-X,b.y-Y);
          if(d<m*0.25&&now-(b.lp||0)>150){
            b.lp=now; b.hot=1;
            b.vx+=(b.x-X)/(d+1)*m*0.18; b.vy+=(b.y-Y)/(d+1)*m*0.18;
          }
        }
        pokeSim();
        return;
      }
      if(mode==='pixels'){     // the finger is a heat source: drag to paint warmth
        if(pix) pixHeat(X/pix.s,Y/pix.s,2.2*Math.sqrt(pix.cols/30),0.4);
        return;
      }
      if(mode==='leds'&&act(250)){   // fire pulses along the strip from the nearest edge
        const dEdge=[Y,H-Y,X,W-X];   // top, bottom, left, right
        const e=dEdge.indexOf(Math.min.apply(null,dEdge));
        const L=2*(W+H);
        const s=e===1?X : e===3?W+(H-Y) : e===0?W+H+(W-X) : W+H+W+Y;
        ledPulses.push({s,v:L*0.45,life:1});
        ledPulses.push({s,v:-L*0.45,life:1});
        return;
      }
      if(mode==='ripples'){     // tap the pond: a drop lands right at the finger
        if(act(150)) rippleRing(X,Y,1,c);   // full strength, and born small at the finger
        return;
      }
      if(mode==='waves'){      // grab the line: drag it and it springs back in ripples
        if(pluckU){
          const N=pluckU.length, idx=Math.max(1,Math.min(N-2,Math.round(x*(N-1))));
          const disp=Math.max(-H*0.35,Math.min(H*0.35,Y-H/2));
          for(const o of [-1,0,1]){        // hold the string at the finger
            const j=idx+o;
            if(j>0&&j<N-1){ pluckU[j]=disp*(o?0.7:1); pluckV[j]=0; }
          }
          pluckLive=true; pokeSim();
        }
        return;
      }
      if(mode==='fountain'){
        if(act(250)&&parts.length<400){
          // the same two expressions the voice uses at level 1, so a tap and a
          // shout make the same explosion
          const n=Math.min(400-parts.length,(80*tw('burst'))|0);
          const sp2=0.72*m*Math.sqrt(tw('burst'));
          for(let i=0;i<n;i++){
            const a=Math.random()*Math.PI*2, sv=sp2*(0.3+0.7*Math.random());
            parts.push({x:X,y:Y,vx:Math.cos(a)*sv,vy:Math.sin(a)*sv,
              size:(1.2+Math.random()*2.2)*(H/800),c:c.slice(),
              life:1+Math.random()*0.4,trail:true,px:X,py:Y,h:[X,Y]});
          }
        }
        return;
      }
      if(mode==='stars'){      // touch the sky and it scatters, as a shout does
        if(act(250)){
          const n=18, sp2=m*0.19;      // the voice's own (7+level*11) and 0.05+0.14*level
          for(let i=0;i<n&&sparks.length<200;i++){
            const ang=Math.random()*Math.PI*2, v=sp2*(0.25+0.75*Math.random());
            sparks.push({x:X,y:Y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,
              size:(1.0+Math.random()*1.8)*(H/800),c:c.slice(),
              life:1,keep:Math.random()<0.35,burst:true});
          }
          pokeSim();
          return;
        }
      }
      // fallback (rapid taps on stars): soft ring
      if(touchRings.length>=24) return;
      touchRings.push({x:X,y:Y,r:4,v:0.18*m,a:0.35,c});
    },
    frame(dt){
      analyse(dt);
      frameN++;
      if(!ctx) return;
      t+=dt;
      // A retired style can arrive AFTER init - a preset, or a settings restore -
      // and init's clamp has already run by then. Clamping here means every
      // route agrees on one answer: `flow` was deleted on 2026-09-05 and a
      // student's saved setup falls back to Mandala rather than to whatever the
      // dispatch chain happens to end with.
      if(!VISMODES[SETTINGS.visMode]) SETTINGS.visMode='mandala';
      const W=canvas.width,H=canvas.height,mode=SETTINGS.visMode;
      // THE FRAME IS CLEARED, NOT FADED, AND THAT IS THE WHOLE GHOSTING FIX.
      //
      // Every style used to paint rgba(background, fade) over the canvas, which
      // on an 8-bit surface is dst = round(dst * (1 - fade)). A pixel stops
      // moving the moment dst * fade <= 0.5, so the fade leaves a PERMANENT
      // residue of floor(0.5/fade) — and no value below 0.5 can ever reach zero.
      // Tuning the number cannot fix it; only 0.5 or more can, and that erases
      // the trail it exists to draw.
      //
      // Measured off screenshots (probes/phase-11/ghost.js), dim-but-not-black
      // pixels at rest and after ten seconds of silence:
      //
      //   ripples  0.30    6.96% -> 90.49%, still 90.49% at 25 s
      //   leds     0.40   10.24% -> 20.49%
      //   waves    0.30    7.16% -> 19.95%
      //   flow     0.045   6.58% -> 17.40%, STILL climbing at 25 s  [style deleted]
      //   fountain 0.10    6.55% -> 10.91%
      //   lava     1       7.64% ->  7.13%   <- hard clear, nothing left
      //   pixels   1      88.21% -> 88.16%   <- hard clear, nothing left
      //
      // The two that already cleared were the two that were clean, which is the
      // measurement that decided this. Ripples was the worst by a distance: 84%
      // of the screen holding a stalled 1/255 ghost of every ring ever drawn,
      // which is also the likeliest reason it "stopped recognising" claps — the
      // onsets were all firing (40 of 40, measured), the new ring just landed in
      // a wash of old ones.
      //
      // Seven of the nine styles redraw themselves from state every frame and so
      // need nothing but the clear. The two whose trail WAS the residue — Flow's
      // ribbons and Fireworks' comet tails — now carry their own path in `h` and
      // draw it. (Flow was DELETED at the user's request on 2026-09-05. The
      // sentence stays because it is the record of what the measurement found,
      // and Fireworks still carries the fix.) This project has been here before: PHASE-11 §11.3 deleted the
      // firework glow rather than tune a gradient that banded, and Soundscape
      // deleted its radial glow before that. Same answer, third time.
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')';
      ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      if(mode==='mandala') drawMandala(W,H,dt);
      else if(mode==='lava') drawLava(W,H,dt);
      else if(mode==='waves') drawWaves(W,H,dt);
      else if(mode==='pixels') drawPixels(W,H,dt);
      else if(mode==='leds') drawLeds(W,H,dt);
      else if(mode==='ripples') drawRipples(W,H,dt);
      else if(mode==='fountain') drawFireworks(W,H,dt);
      else drawStars(W,H,dt);
      drawTouchRings(W,H,dt);
      ctx.globalCompositeOperation='source-over';
      // keep a ~20 s animated tail after the last activity, then let the sim
      // sleep (the last frame stays on screen as a calm still)
      if(level>0.01||rings.length||parts.length||shoots.length||touchRings.length||
         sparks.length||mandHot()||(mode==='waves'&&pluckLive)||
         (pix&&pix.hot)||ledPulses.length) lastActive=t;
      if(t-lastActive<20) pokeSim();
    },
    reset(){
      if(!ctx) return;
      rings=[]; parts=[]; touchRings=[]; shoots=[]; stars=[]; blobs=[]; sparks=[]; waxLvl=0;
      mandBoost=null; mandReach=null; mandN=0;
      memStars=[]; wave=null; wave2=null;
      pluckU=null; pluckV=null; pluckLive=false;
      pix=null; ledPulses=[]; ledChase=0;
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    },
  };
})();
/* ===== ANIMATION END ===== */

boot();
</script>
</body>
</html>
