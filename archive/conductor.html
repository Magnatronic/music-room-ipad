<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Conductor – Music Room</title>
<link rel="stylesheet" href="../framework.css">
</head>
<body>
<script src="../framework.js"></script>
<script>  // this page lives a folder down; the framework writes a relative Home link
  addEventListener('DOMContentLoaded',()=>{ const h=document.getElementById('homeBtn'); if(h) h.href='../index.html'; });
</script>
<script src="../songs.js"></script>
<script>
'use strict';
/* ===== ANIMATION START =====
   Conductor — a gestural instrument. Music sounds only while the student MOVES;
   stillness lets it rest. Unlike the on-rails original, PITCH now follows the
   hand: X picks the scale note, height picks the octave (idea #1 — a theremin
   you conduct). Three ways to play:

     • Play    — free gestural instrument (X = note, Y = octave), motion-gated.
     • Trace   — a glowing guide path (a shape, or a song's pitch-contour) to
                 follow. Two independent toggles:
                   pitch  : Free instrument (pitch = finger) | Guided melody
                            (pitch snaps to the path's intended note)
                   guide  : Trace freely (self-paced) | Chase the comet (a lead
                            dot the student follows; its pace = the tempo)
     • Texture — an ambient chord pad that swells with motion (pure cause/effect).

   Themes tint the trail + notes like the other apps; a Trail persistence slider
   turns the 2-D canvas into light-painting (the background is faded, not cleared,
   so gestures leave glowing tails).

   Motion sensitivity is the access control: high sens counts tremor-level motion
   ("whisper mode"). Pointer motion is smoothed so the sound breathes, not stutters.
*/
const Anim = (() => {

  const SONGS=window.MUSIC_SONGS;
  const CMODE_OPTS={ play:{label:'🪄 Play (free)'}, trace:{label:'✏️ Trace a path'}, texture:{label:'🌊 Texture'} };
  const TPITCH_OPTS={ free:{label:'🎨 Free instrument'}, guided:{label:'🎯 Guided melody'} };
  const TGUIDE_OPTS={ free:{label:'✋ Trace freely'}, comet:{label:'☄ Chase the comet'} };
  const TRAIL_OPTS={ comet:{label:'☄ Comet'}, stardust:{label:'✨ Stardust'} };
  const SG_SCALES={ major:{label:'Major (do-re-mi)'}, minor:{label:'Minor'}, penta:{label:'Pentatonic'} };

  // Guide paths. Shapes are parametric (pitch comes from screen position when
  // traced); songs become a left→right score (time across, pitch up) whose notes
  // are played in order. Margins keep everything off the screen edges.
  const M0=0.09, SP=1-M0*2, TAU=Math.PI*2;
  const SHAPES={
    wave:    { label:'〜 Wave',    fn:t=>({x:M0+SP*t, y:0.5+0.34*Math.sin(t*TAU*2)}) },
    rainbow: { label:'🌈 Arc',     fn:t=>({x:M0+SP*t, y:0.20+0.62*Math.sin(t*Math.PI)}) },
    ramp:    { label:'📈 Rising',  fn:t=>({x:M0+SP*t, y:0.20+0.62*t}) },
    circle:  { label:'⭕ Loop',    fn:t=>({x:0.5+0.31*Math.cos(t*TAU-Math.PI/2), y:0.5+0.31*Math.sin(t*TAU-Math.PI/2)}) },
    spiral:  { label:'🌀 Spiral',  fn:t=>{ const th=t*TAU*3, r=0.05+0.30*t; return {x:0.5+r*Math.cos(th), y:0.5+r*Math.sin(th)}; } },
    figure8: { label:'∞ Figure-8', fn:t=>({x:0.5+0.32*Math.sin(t*TAU), y:0.5+0.24*Math.sin(t*TAU*2)}) },
  };
  const SHAPE_SAMPLES=180;
  function pathOptions(){
    const o={}; for(const k in SHAPES) o[k]={label:SHAPES[k].label};
    for(const k in SONGS) o[k]={label:SONGS[k].label};
    return o;
  }
  function isSongPath(k){ return !SHAPES[k]; }

  let ctx=null, W=0,H=0, sig='', progEl=null;
  let motion=0, stillFor=0, lastX=0.5, lastY=0.5, hasPointer=false, time=0;
  let parts=[], pad=null;
  // the conducting voice (built from the chosen framework VOICE recipe, but the
  // envelope is ours so we can gate it by MOTION rather than touch)
  let voice=null, lastCol=-1;
  // trace state
  let curPath=null;                 // {kind, pts:[{x,y,col?}], beats?, dur?}
  let cometU=0, cometNi=0, cometT=0, progress=0;

  function song(){ return SONGS[SETTINGS.song]||SONGS.twinkle; }
  function curVoice(){ return VOICES[SETTINGS.voice]||VOICES.warm; }
  function inTexture(){ return SETTINGS.conductMode==='texture'; }
  function inTrace(){ return SETTINGS.conductMode==='trace'; }
  function guidedPitch(){ return curPath && (curPath.kind==='song' || SETTINGS.tracePitch==='guided'); }
  function useComet(){ return inTrace() && SETTINGS.traceGuide==='comet'; }

  // ── motion envelope: the heart of the app ──
  function senseGain(){ return 40+SETTINGS.sens*360; }
  function updateMotion(dt){
    let sp=0; hasPointer=false;
    for(const p of pointers){ if(!p.down) continue; hasPointer=true; lastX=p.x; lastY=p.y; sp=Math.max(sp,Math.hypot(p.dx,p.dy)); }
    const target=Math.min(1, sp*senseGain());
    const k=target>motion?dt/0.14:dt/0.45;   // rise on a flourish, release gently
    motion+=(target-motion)*Math.min(1,k);
    if(motion<0.05) stillFor+=dt; else stillFor=0;
  }
  function conducting(){ return hasPointer && (motion>=0.05 || stillFor<(SETTINGS.patience||1)); }
  function tempoMul(){ return 0.5+Math.pow(motion,0.8)*1.1; }   // 0.5×..~1.6× with vigour

  // ── pitch helpers (reuse the framework's X→note / Y→octave map) ──
  function fingerFreq(){ return freqForX(lastX,lastY)*Math.pow(2,curVoice().oct); }
  function shapeFreq(pt){ return freqForX(pt.x,pt.y)*Math.pow(2,curVoice().oct); }
  function songFreq(col){ const n=NOTES[Math.max(0,Math.min(NOTES.length-1,col))]; return (n?n.freq:110)*Math.pow(2,curVoice().oct); }
  function colOfX(x){ return colIndex(x); }

  // ── the conducting voice ──
  function buildVoice(){
    if(voice||!audioCtx||!masterGain) return;
    try{
      const ac=audioCtx, V=curVoice();
      const gain=ac.createGain(); gain.gain.value=0.0001;
      const filt=ac.createBiquadFilter(); filt.type=V.filter.type; filt.frequency.value=V.filter.base; if(V.filter.q) filt.Q.value=V.filter.q;
      const pan=ac.createStereoPanner();
      filt.connect(gain); gain.connect(pan); pan.connect(masterGain);
      const nodes=[];
      for(const o of V.oscs){
        const osc=ac.createOscillator(); osc.type=o.type||'sine'; if(o.detune) osc.detune.value=o.detune;
        const g=ac.createGain(); g.gain.value=(o.gain!==undefined?o.gain:1);   // sustained: ignore pluck decayTo
        osc.connect(g); g.connect(filt); osc.start(); nodes.push({osc,ratio:o.ratio||1});
      }
      voice={V,gain,filt,pan,nodes,freq:0};
      soundingVoices++; updatePolyGain();
    }catch(e){}
  }
  function releaseVoice(){
    if(!voice) return; const v=voice; voice=null;
    try{
      v.gain.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.2);
      setTimeout(()=>{ v.nodes.forEach(n=>{try{n.osc.stop();}catch(e){}}); try{v.filt.disconnect();v.gain.disconnect();v.pan.disconnect();}catch(e){} },1400);
    }catch(e){}
    soundingVoices=Math.max(0,soundingVoices-1); updatePolyGain();
  }
  function driveVoice(freq,col,level){
    if(!voice) return;
    try{
      const ac=audioCtx, now=ac.currentTime, V=voice.V;
      if(freq && Math.abs(freq-voice.freq)>0.5){
        voice.freq=freq;
        const tc=GLIDE_TIMES[SETTINGS.glide]||0.05;
        voice.nodes.forEach(n=>n.osc.frequency.setTargetAtTime(freq*n.ratio,now,tc));
      }
      voice.pan.pan.setTargetAtTime((lastX*2-1)*0.5,now,0.10);
      voice.filt.frequency.setTargetAtTime(V.filter.base+Math.max(0,Math.min(1,lastY))*V.filter.track,now,0.12);
      const g=Math.max(0.0001, level*V.gain);
      voice.gain.gain.setTargetAtTime(g,now, level>0.02?0.05:0.18);
    }catch(e){}
    // a soft burst each time the note actually changes — the pitch made visible
    if(col!==lastCol && level>0.05){ lastCol=col; noteBurst(lastX*W,(1-lastY)*H,bandRGB255(col)); }
  }

  // ── texture pad (ambient chord, swelling with motion) ──
  function ensurePad(){
    if(!inTexture() || pad || !audioCtx || !masterGain || !NOTES.length) return;
    try{
      const ac=audioCtx;
      const gain=ac.createGain(); gain.gain.value=0.0001;
      const filt=ac.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=700; filt.Q.value=1.2;
      filt.connect(gain); gain.connect(masterGain);
      const oscs=[], chord=[NOTES[0],NOTES[2%NOTES.length],NOTES[4%NOTES.length]];
      for(const nt of chord) for(const det of [-6,6]){
        const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=nt.freq/2; o.detune.value=det;
        const g=ac.createGain(); g.gain.value=0.3; o.connect(g); g.connect(filt); o.start(); oscs.push(o);
      }
      const tip=ac.createOscillator(); tip.type='sine'; tip.frequency.value=NOTES[0].freq*2;
      const tg=ac.createGain(); tg.gain.value=0.12; tip.connect(tg); tg.connect(filt); tip.start(); oscs.push(tip);
      pad={oscs,filt,gain}; soundingVoices++; updatePolyGain();
    }catch(e){}
  }
  function killPad(){
    if(!pad) return; const p=pad; pad=null;
    try{ p.gain.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.3);
      setTimeout(()=>{ p.oscs.forEach(o=>{try{o.stop();}catch(e){}}); try{p.filt.disconnect();p.gain.disconnect();}catch(e){} },2500);
    }catch(e){}
    soundingVoices=Math.max(0,soundingVoices-1); updatePolyGain();
  }

  // ── trace paths ──
  function buildPath(){
    const key=SETTINGS.path;
    if(isSongPath(key)){
      const s=SONGS[key]||song(), notes=s.notes, n=notes.length, span=Math.max(2,s.span);
      const pts=notes.map((nn,i)=>({ x:M0+SP*(n<2?0.5:i/(n-1)), y:0.16+0.68*(1-nn[0]/Math.max(1,span-1)), col:nn[0] }));
      curPath={ kind:'song', key, pts, beats:notes.map(nn=>nn[1]), bpm:s.bpm||100 };
    } else {
      const fn=(SHAPES[key]||SHAPES.wave).fn, pts=[];
      for(let i=0;i<SHAPE_SAMPLES;i++) pts.push(fn(i/(SHAPE_SAMPLES-1)));
      curPath={ kind:'shape', key, pts };
    }
    cometU=0; cometNi=0; cometT=0; progress=0; lastCol=-1;
  }
  function nearestOnPath(){
    const pts=curPath.pts; let bi=0, bd=1e9;
    for(let i=0;i<pts.length;i++){ const dx=pts[i].x-lastX, dy=pts[i].y-(lastY), d=dx*dx+dy*dy; if(d<bd){bd=d;bi=i;} }
    return bi;
  }
  function advanceComet(dt){
    if(!conducting()) return;
    if(curPath.kind==='song'){
      cometT+=dt*tempoMul();
      const dur=curPath.beats[cometNi]*(60/curPath.bpm);
      if(cometT>=dur){ cometT=0; cometNi=(cometNi+1)%curPath.pts.length; }
      progress=cometNi/curPath.pts.length;
    } else {
      cometU=(cometU+dt*tempoMul()*0.10)%1;
      progress=cometU;
    }
  }
  function cometIndex(){
    if(curPath.kind==='song') return cometNi;
    return Math.round(cometU*(curPath.pts.length-1));
  }

  // Resolve this frame's target pitch + which note-column it is. Returns null when
  // there's nothing to sound (texture mode manages its own pad).
  function resolvePitch(dt){
    if(inTexture()) return null;
    if(!inTrace()) return { freq:fingerFreq(), col:colOfX(lastX) };   // free play
    if(!curPath || curPath.key!==SETTINGS.path) buildPath();
    let idx;
    if(useComet()){ advanceComet(dt); idx=cometIndex(); }
    else { idx=nearestOnPath(); progress=idx/Math.max(1,curPath.pts.length-1); }
    const pt=curPath.pts[idx];
    if(guidedPitch()){
      if(curPath.kind==='song') return { freq:songFreq(pt.col), col:pt.col, pt };
      return { freq:shapeFreq(pt), col:colOfX(pt.x), pt };
    }
    return { freq:fingerFreq(), col:colOfX(lastX), pt };   // free instrument: guide is decoration
  }

  // ── visuals ──
  function noteBurst(x,y,col){ parts.push({x,y,age:0,life:0.5,col,ring:true}); pokeSim(); }
  function trailDot(x,y,col){
    const q=activeQuality(), cap=q==='low'?70:q==='med'?150:240;
    if(parts.length>=cap) return;
    if(SETTINGS.trail==='stardust'){
      const a=Math.random()*TAU, sp=H*0.1*(0.3+Math.random());
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,life:0.5+Math.random()*0.6,col,size:1.5+Math.random()*2.5});
    } else parts.push({x,y,vx:0,vy:H*0.02,age:0,life:0.7+motion*0.6,col,size:4+motion*9});
  }
  function noteColor(col){ return bandRGB255(Math.max(0,Math.min(NOTES.length-1,col))); }
  function themeColor(){ const cols=Anim.themes[currentTheme].colors, c=cols[Math.floor(time*0.4)%cols.length]; return [c[0]*255|0,c[1]*255|0,c[2]*255|0]; }
  function currentColor(){ return SETTINGS.colorMode==='note' ? noteColor(lastCol<0?colOfX(lastX):lastCol) : themeColor(); }

  function drawGuide(){
    if(!inTrace()||!curPath) return;
    const pts=curPath.pts;
    ctx.save();
    ctx.lineWidth=Math.max(3,H*0.006); ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,255,255,0.22)';
    ctx.beginPath();
    pts.forEach((p,i)=>{ const X=p.x*W, Y=(1-p.y)*H; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.stroke();
    // note markers coloured by pitch (songs: one per note; shapes: sparse dots)
    const step=curPath.kind==='song'?1:Math.max(1,Math.floor(pts.length/14));
    for(let i=0;i<pts.length;i+=step){
      const p=pts[i], col=curPath.kind==='song'?p.col:colOfX(p.x), c=noteColor(col);
      ctx.fillStyle='rgba('+c.join(',')+',0.5)';
      ctx.beginPath(); ctx.arc(p.x*W,(1-p.y)*H,H*0.010,0,TAU); ctx.fill();
    }
    // the comet the student chases
    if(useComet()){
      const p=curPath.pts[cometIndex()], c=currentColor();
      const r=H*0.02*(1+motion), X=p.x*W, Y=(1-p.y)*H;
      const g=ctx.createRadialGradient(X,Y,0,X,Y,r*3);
      g.addColorStop(0,'rgba(255,255,255,0.95)'); g.addColorStop(0.4,'rgba('+c.join(',')+',0.7)'); g.addColorStop(1,'rgba('+c.join(',')+',0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(X,Y,r*3,0,TAU); ctx.fill();
    }
    ctx.restore();
  }

  function applySetup(){
    parts.length=0; cometU=0; cometNi=0; cometT=0; progress=0; lastCol=-1;
    if(isSongPath(SETTINGS.path) && inTrace()){
      const s=SONGS[SETTINGS.path]; if(s){ if(s.scaleHint&&SG_SCALES[s.scaleHint]) SETTINGS.scale=s.scaleHint; SETTINGS.noteCount=s.span; }
    } else {
      SETTINGS.noteCount=8;   // a full range of notes across the screen for free/shape play
    }
    SETTINGS.mode='flow'; SETTINGS.yAxis='octaves';
    saveSettings(); refreshMusic();
    buildPath();
    killPad();                // rebuilt on demand by ensurePad when in texture
    if(inTexture()) releaseVoice();
    setProgress();
  }
  function setProgress(){ if(progEl) progEl.style.width=(inTrace()?progress*100:0)+'%'; }
  function settingsSig(){ return [SETTINGS.conductMode,SETTINGS.path,SETTINGS.tracePitch,SETTINGS.traceGuide,SETTINGS.scale,SETTINGS.rootNote,SETTINGS.octave,SETTINGS.voice].join('|'); }

  return {
    appLabel:'🪄 Conduct',
    sectionLabel:'Conductor',
    lockMode:'flow',
    noVoices:true,
    hideRail:['clear'],
    themes:{
      glow:  {label:'✨ Glow',  colors:[[1,0.9,0.4],[0.5,1,0.7],[0.4,0.8,1],[1,0.6,0.8],[0.8,0.7,1]]},
      ocean: {label:'🌊 Ocean', colors:[[0,0.6,1],[0,1,0.8],[0.1,0.3,0.9],[0,0.8,0.6],[0.4,0.9,1]]},
      aurora:{label:'🌌 Aurora',colors:[[0.1,1,0.5],[0.5,0.1,1],[0,0.9,0.7],[0.8,0.2,1],[0.1,0.8,0.4]]},
      lava:  {label:'🔥 Lava',  colors:[[1,0.15,0],[1,0.5,0],[1,0.9,0.1],[0.8,0,0.1],[1,0.3,0.05]]},
      neon:  {label:'⚡ Neon',  colors:[[1,0,0.8],[0,1,0.2],[1,0.9,0],[0,0.8,1],[1,0.1,0.5]]},
      prism: {label:'🌈 Prism', colors:[[1,0,0.2],[1,0.6,0],[0.2,1,0.2],[0,0.8,1],[0.7,0.2,1]]},
    },
    defaults:{ theme:'glow', conductMode:'play', path:'wave', tracePitch:'free', traceGuide:'free',
      song:'twinkle', sens:0.5, patience:1.0, trail:'comet', persistence:0.6,
      mode:'flow', paint:true, yAxis:'octaves', octaveRows:'3', glide:'smooth', voice:'warm',
      colorMode:'note', scale:'major', noteCount:8, showLabels:false },
    schema:[],
    railButtons:[
      { id:'cdrestart', label:'Restart', icon:()=>'⏮', title:()=>'Restart the path from the beginning',
        show:()=>true, onClick(){ cometU=0; cometNi=0; cometT=0; progress=0; lastCol=-1; setProgress(); }},
    ],
    // 🪄 Conduct tab
    // The app's own tab. Everything here is what THIS app is; none of it is
    // Register/Scale/Starting note, which is all the Notes tab holds now.
    // See PHASE-4E-APP-TAB.md.
    buildApp(el){
      el.appendChild(makeChips('What to conduct','conductMode',CMODE_OPTS,()=>{ applySetup(); buildAppPanel(); }));
      if(inTrace()){
        el.appendChild(makeChips('Path to trace','path',pathOptions(),()=>{ applySetup(); buildAppPanel(); }));
        el.appendChild(makeChips('Pitch','tracePitch',TPITCH_OPTS));
        el.appendChild(makeChips('Guide','traceGuide',TGUIDE_OPTS,()=>{ applySetup(); }));
        if(isSongPath(SETTINGS.path)){
          const note=document.createElement('div');
          note.className='hint'; note.style.lineHeight='1.4';
          note.textContent='Songs always play in order (Guided melody) — trace left to right to hear the tune.';
          el.appendChild(note);
        }
      }
      el.appendChild(makeSlider({key:'sens',label:'Motion sensitivity (high = tiny movements count)',min:0,max:1,step:0.05,dp:2}));
      el.appendChild(makeSlider({key:'patience',label:'Seconds of stillness before the music rests',min:0.2,max:3,step:0.1,dp:1}));
      if(inTrace()) el.appendChild(makeSongImportUI(()=>{ applySetup(); buildAppPanel(); }));
    },
    // 🎼 Notes — the same in every app.
    buildInstrument(el){
      appendTuning(el,()=>{ refreshMusic(); buildPath(); },{scales:SG_SCALES,heading:false});
    },
    // 🎸 Instrument tab — tuning on top of voice/effects/volume
    // ✨ Visuals tab
    buildVisuals(el){
      el.appendChild(makeChips('Baton trail','trail',TRAIL_OPTS));
      el.appendChild(makeSlider({key:'persistence',label:'Trail persistence',min:0,max:1,step:0.05,dp:2}));
      appendBgControl(el);
    },
    init(cv){
      ctx=cv.getContext('2d'); W=canvas.width; H=canvas.height;
      if(!progEl){
        const st=document.createElement('style');
        st.textContent='#cdProgress{position:fixed;top:0;left:0;height:6px;width:0;z-index:6;'+
          'background:linear-gradient(90deg,#f5d117,#3bb54a,#1ca9a9);border-radius:0 3px 3px 0;'+
          'transition:width 0.2s;pointer-events:none}';
        document.head.appendChild(st);
        progEl=document.createElement('div'); progEl.id='cdProgress'; stageEl.appendChild(progEl);
      }
      canvas.addEventListener('mousedown',()=>getAudio());
      canvas.addEventListener('touchstart',()=>getAudio(),{passive:true});
      sig=settingsSig();
      applySetup();
    },
    resize(w,h){ W=w; H=h; },
    // the baton: every interpolated movement step leaves trail
    splat(x,y){ trailDot(x*W,(1-y)*H,currentColor()); },
    frame(dt){
      time+=dt;
      const s2=settingsSig();
      if(s2!==sig){ sig=s2; applySetup(); }
      updateMotion(dt);
      if(hasPointer||motion>0.01||parts.length||pad||voice) pokeSim();

      // ── audio ──
      if(inTexture()){
        releaseVoice(); ensurePad();
        if(pad){
          const want=conducting()?0.15*Math.pow(motion,1.3)*(0.4+0.6*lastY):0;
          try{
            pad.gain.gain.setTargetAtTime(want+0.0001,audioCtx.currentTime,0.18);
            pad.filt.frequency.setTargetAtTime(350+Math.max(0,Math.min(1,lastY))*2300,audioCtx.currentTime,0.2);
          }catch(e){}
        }
      } else {
        buildVoice();
        const info=resolvePitch(dt);
        const level=conducting()? Math.min(1,0.15+motion*1.1)*(0.35+0.65*Math.max(0,Math.min(1,lastY))) : 0;
        if(info) driveVoice(info.freq,info.col,level);
        setProgress();
      }

      // ── draw ──
      // Trail persistence: fade the background instead of clearing it, so strokes
      // linger (light-painting). persistence 0 ≈ clear each frame, 1 ≈ long tails.
      const fade=Math.max(0.06,1-SETTINGS.persistence*0.94);
      ctx.fillStyle='rgba('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+','+fade.toFixed(3)+')';
      ctx.fillRect(0,0,W,H);

      if(!hasPointer && motion<0.05){    // resting shimmer where the baton last was
        const a=0.05+0.03*Math.sin(time*1.6);
        const g=ctx.createRadialGradient(lastX*W,(1-lastY)*H,0,lastX*W,(1-lastY)*H,H*0.18);
        g.addColorStop(0,'rgba(255,255,255,'+a.toFixed(3)+')'); g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      }
      drawGuide();
      for(const p of parts){
        p.age+=dt; if(p.vx){ p.x+=p.vx*dt; p.y+=p.vy*dt; }
        const k=1-p.age/p.life; if(k<=0) continue;
        if(p.ring){
          ctx.strokeStyle='rgba('+p.col.join(',')+','+(k*0.9).toFixed(3)+')'; ctx.lineWidth=3.5*k+1;
          ctx.beginPath(); ctx.arc(p.x,p.y,(1-k)*H*0.11+8,0,TAU); ctx.stroke();
        } else {
          ctx.fillStyle='rgba('+p.col.join(',')+','+(k*0.85).toFixed(3)+')';
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size*k+0.4,0,TAU); ctx.fill();
        }
      }
      parts=parts.filter(p=>p.age<p.life);
      if(hasPointer){                    // the baton tip, brightening with motion
        const col=currentColor(), r=H*(0.015+motion*0.03);
        const g=ctx.createRadialGradient(lastX*W,(1-lastY)*H,0,lastX*W,(1-lastY)*H,r*4);
        g.addColorStop(0,'rgba(255,255,255,0.9)'); g.addColorStop(0.3,'rgba('+col.join(',')+',0.55)'); g.addColorStop(1,'rgba('+col.join(',')+',0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lastX*W,(1-lastY)*H,r*4,0,TAU); ctx.fill();
      }
    },
    reset(){ parts.length=0; if(ctx){ ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')'; ctx.fillRect(0,0,W,H); } },
    _dbg(){ return { mode:SETTINGS.conductMode, path:SETTINGS.path, kind:curPath&&curPath.kind, pts:curPath?curPath.pts.length:0,
      voice:!!voice, pad:!!pad, sounding:soundingVoices, motion:+motion.toFixed(3), freq:voice?+voice.freq.toFixed(1):0,
      conducting:conducting(), gain:voice?+voice.gain.gain.value.toFixed(4):0,
      progress:+progress.toFixed(3), noteCount:SETTINGS.noteCount, yAxis:SETTINGS.yAxis }; },
  };
})();
/* ===== ANIMATION END ===== */

boot();
</script>
