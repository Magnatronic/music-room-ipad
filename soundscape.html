<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Soundscape Mixer – Music Room</title>
<link rel="stylesheet" href="framework.css">
<style>
/* slider channels: icons sit above the per-column control strip */
#bands .band .lbl{bottom:9.5vh;font-size:5vmin;transition:opacity 0.3s}
#bands .band .lbl svg{width:8vmin;height:8vmin;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.65))}
/* per-column controls: a quick mute and a tune button under every slider */
#ssStrip{position:fixed;left:0;right:0;bottom:0;height:7vh;min-height:48px;
  display:grid;grid-template-columns:repeat(8,1fr);z-index:6;pointer-events:none}
.sscell{display:flex;align-items:center;justify-content:center;gap:1vmin;pointer-events:none}
.ssbtn{pointer-events:auto;width:5.4vmin;height:5.4vmin;min-width:36px;min-height:36px;
  border-radius:50%;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.28);
  color:#fff;font-size:2.4vmin;cursor:pointer;display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;padding:0;
  transition:background 0.2s,border-color 0.2s}
.ssbtn:active{transform:scale(1.1)}
.ssbtn.muted{background:rgba(165,60,70,0.55);border-color:rgba(255,140,150,0.7)}
/* per-sound editor card */
#ssEdit{position:fixed;bottom:9vh;z-index:21;width:320px;max-width:92%;
  background:rgba(0,0,0,0.88);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.16);border-radius:14px;padding:14px 16px;
  font-family:sans-serif;color:#fff;max-height:70vh;overflow-y:auto}
#ssEdit .hd{display:flex;align-items:center;gap:9px;margin-bottom:12px}
#ssEdit .hd .nm{flex:1;font-size:14px;font-weight:600}
#ssEdit .hd .x{background:none;border:none;color:var(--ink-dim);font-size:18px;cursor:pointer;padding:2px 6px}
/* 2026-07 chrome redesign: accent sub-menu edge; rail stops above the strip */
#ssEdit{border:1px solid color-mix(in srgb,var(--accent) 55%,transparent)}
</style>
</head>
<body>
<script src="framework.js"></script>
<script src="assets/openmoji_soundscape.js"></script>
<script>
'use strict';
/* ===== ANIMATION START =====
   Soundscape Mixer — a mynoise.net-style ambient mixer for regulation and
   wind-down. The screen is 8 full-height slider columns, one per sound layer,
   each washed with a subtle tint of its own colour; touching a column sets
   that layer's level. Under every slider sits a control strip: 🔇 mutes that
   sound without losing its level, 🎚 opens the sound's editor card with its
   fine-tuning sliders (how often / variation / pitch / tone / movement…).
   Scenes (Calm classics / Rainstorm / Forest / Ocean / Night sky) swap in a
   different set of 8 layers with a cohesive palette; the 🌙 rail button
   glides every slider down to silence for session wind-down. The mix is
   remembered per scene between visits (fades back in at the first touch).

   Every sound is synthesized live — no samples, fully offline. Tuning is
   stored per device (SETTINGS.lp) and captured by Presets. Idle layers cost
   nothing: audio nodes exist only while a slider is up. Icons are OpenMoji
   (assets/openmoji_soundscape.js, CC BY-SA 4.0) with system-emoji fallback.
*/
const Anim = (() => {

  // ── shared noise + LFO helpers ──
  let noiseBuf=null;
  function mkNoise(ac){
    if(!noiseBuf){
      noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s;
  }
  function lfo(ac,rate,depth,param){
    const o=ac.createOscillator(); o.frequency.value=rate;
    const g=ac.createGain(); g.gain.value=depth;
    o.connect(g); g.connect(param); o.start();
    return ()=>{ try{o.stop();o.disconnect();g.disconnect();}catch(e){} };
  }

  // ── channel state: v is the slider (0..1), m mutes it without losing v ──
  const NCH=8, GREY=[150,155,165];
  const ch=[...Array(NCH)].map(()=>({v:0,m:false,sent:-1,zeroAt:0}));
  const act=Array(NCH).fill(null);          // live audio per channel: {gain,stop}
  let windOn=false;                          // 🌙 wind-down gliding everything to 0
  let ctx=null, t=0, lastScene=null, pools={}, fxq=[], mixRef=null;
  let ptrack={};                             // per-pointer: ignore touches starting on the strip
  let mBtns=[], gBtns=[], stripEl=null;      // per-column mute/tune buttons
  let editI=-1, editEl=null;                 // open sound-editor card
  let lastLocked=null;

  function scene(){ return SCENES[SETTINGS.scene]||SCENES.calm; }
  function LYS(){ return scene().layers; }
  function rk(i){ const L=LYS()[i]; return L?L.key:null; }
  // slider colours come from the scene palette so each scene reads as one world
  function col(i){ const p=scene().pal; return (p&&p[i])||(LYS()[i]?LYS()[i].color:[255,255,255]); }
  function pool(i){ return pools[i]||(pools[i]=[]); }

  // per-sound fine-tuning: SETTINGS.lp[recipeKey][param], 1 = the shipped sound.
  // rate/vari/pitch are read live by the schedulers; tone/move rebuild the layer.
  function P(key,par){
    const o=SETTINGS.lp&&SETTINGS.lp[key], v=o?o[par]:undefined;
    return typeof v==='number'?v:1;
  }
  function vr(i){ return P(rk(i),'vari'); }
  function pt(i){ return P(rk(i),'pitch'); }

  // one-shot canvas events fired by the sound schedulers
  function fx(o){ o.age=0; fxq.push(o); if(fxq.length>80) fxq.shift(); pokeSim(); }

  // slider geometry: the bottom ~18% belongs to the control strip + icon, so the
  // level range starts above it; the top 6% is margin
  const LVL0=0.15, LVLR=0.79;
  function yToLevel(y){ const v=(y-LVL0)/LVLR; return v<0.035?0:Math.min(1,v); }

  // ── recipe toolkit ──
  // noiseLayer: noise → filter chain → gain, with optional LFOs ('gain' or filter idx).
  // tone shifts the whole filter chain darker/brighter; move scales the LFO depths.
  function noiseLayer(cfg){
    return (ac,out,i)=>{
      const tone=P(rk(i),'tone'), move=P(rk(i),'move');
      const n=mkNoise(ac); let node=n; const filts=[];
      (cfg.filters||[]).forEach(f=>{
        const b=ac.createBiquadFilter(); b.type=f[0]; b.frequency.value=f[1]*tone; if(f[2]) b.Q.value=f[2];
        node.connect(b); node=b; filts.push(b); });
      const g=ac.createGain(); g.gain.value=cfg.gain!=null?cfg.gain:0.7;
      node.connect(g); g.connect(out); n.start();
      const stops=(cfg.lfos||[]).map(l=> l[2]==='gain'
        ? lfo(ac,l[0],l[1]*move,g.gain)
        : lfo(ac,l[0],l[1]*move*tone,filts[l[2]||0].frequency));
      return ()=>{ stops.forEach(s=>s()); try{n.stop();n.disconnect();filts.forEach(f=>f.disconnect());g.disconnect();}catch(e){} };
    };
  }
  // events: fire(ac,out,i) on a randomized timer while the layer is alive.
  // The 'rate' tuning scales the interval; unless the layer is steady (heartbeat,
  // pulsar), events also come a little denser as the slider rises — a raised
  // slider should feel like MORE forest, not just a louder one.
  function events(fire,minMs,maxMs,firstMs){
    return (ac,out,i)=>{
      let on=true,tm=null;
      const go=()=>{ if(!on) return; fire(ac,out,i);
        const L=LYS()[i]||{};
        const dens=L.steady?1:(0.7+0.6*(ch[i]?Math.max(0.15,ch[i].v):1));
        tm=setTimeout(go,(minMs+Math.random()*(maxMs-minMs))/Math.max(0.1,P(L.key,'rate')*dens)); };
      tm=setTimeout(go, firstMs!=null?firstMs:250+Math.random()*600);
      return ()=>{ on=false; clearTimeout(tm); };
    };
  }
  function combo(...makers){
    return (ac,out,i)=>{ const stops=makers.map(m=>m(ac,out,i)); return ()=>stops.forEach(s=>{try{s();}catch(e){}}); };
  }

  // ── event sounds (vari widens the random spread — 0 = every event identical;
  //    pitch shifts the whole voice; both are read live at each firing) ──
  function chirp(ac,out,i){
    const vv=vr(i), t0=ac.currentTime+0.05;
    const o=ac.createOscillator(); o.type='sine';
    const base=(2000+Math.random()*2200*vv)*pt(i);
    o.frequency.setValueAtTime(base,t0);
    let tt=t0; const hops=2+Math.floor(Math.random()*(1+2*vv));
    for(let k=0;k<hops;k++){ tt+=0.04+Math.random()*0.06;
      o.frequency.exponentialRampToValueAtTime(base*(0.8+Math.random()*0.5),tt); }
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(0.35,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0008,tt+0.08);
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*1.6-0.8;
    o.connect(g); g.connect(p); p.connect(out);
    o.start(t0); o.stop(tt+0.15);
    fx({kind:'bird',i,x:0.1+Math.random()*0.8,y:0.15+Math.random()*0.35,c:col(i),dur:1.4});
  }
  function cricket(ac,out,i){
    const vv=vr(i), t0=ac.currentTime+0.03, dur=0.45+Math.random()*0.6;
    const o=ac.createOscillator(); o.type='sine'; o.frequency.value=(3900+Math.random()*700*vv)*pt(i);
    const am=ac.createOscillator(); am.frequency.value=21+Math.random()*7*vv;   // the trill
    const dep=ac.createGain(); dep.gain.value=0.06; am.connect(dep);
    const g=ac.createGain(); g.gain.value=0; dep.connect(g.gain);
    g.gain.setValueAtTime(0.07,t0);
    const e=ac.createGain(); e.gain.setValueAtTime(0.0001,t0);
    e.gain.linearRampToValueAtTime(1,t0+0.08);
    e.gain.setValueAtTime(1,t0+Math.max(0.1,dur-0.08));
    e.gain.linearRampToValueAtTime(0.0001,t0+dur);
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*1.4-0.7;
    o.connect(g); g.connect(e); e.connect(p); p.connect(out);
    o.start(t0); am.start(t0); o.stop(t0+dur+0.05); am.stop(t0+dur+0.05);
    fx({kind:'twinkle',i,x:Math.random(),y:0.05+Math.random()*0.12,c:col(i),dur:0.8,size:0.008});
  }
  function owlHoot(ac,out,i){
    const vv=vr(i), pp=pt(i), t0=ac.currentTime+0.05;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650*pp;
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*1.2-0.6;
    lp.connect(p); p.connect(out);
    [[0,0.42,335,0.38],[0.5,0.55,318,0.5]].forEach(h=>{
      const s=t0+h[0];
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(h[2]*pp*(1-0.03*vv+Math.random()*0.06*vv),s);
      o.frequency.linearRampToValueAtTime(h[2]*pp*0.92,s+h[3]);
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,s);
      g.gain.linearRampToValueAtTime(h[1],s+0.06);
      g.gain.setTargetAtTime(0.0001,s+h[3]*0.55,0.09);
      o.connect(g); g.connect(lp); o.start(s); o.stop(s+h[3]+0.4);
    });
    fx({kind:'ripple',i,x:0.12+Math.random()*0.76,y:0.2+Math.random()*0.3,c:col(i),dur:1.6,size:0.05});
  }
  function woodTaps(ac,out,i){
    const vv=vr(i), t0=ac.currentTime+0.03;
    const n=7+Math.floor(Math.random()*8*vv), gap=0.05+Math.random()*0.012;
    const bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=(1050+Math.random()*300*vv)*pt(i); bp.Q.value=2.5;
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*1.2-0.6;
    bp.connect(p); p.connect(out);
    const x=0.1+Math.random()*0.8, y=0.2+Math.random()*0.25;
    for(let k=0;k<n;k++){
      const s=t0+k*gap, nb=mkNoise(ac);
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,s);
      g.gain.linearRampToValueAtTime(0.5,s+0.004);
      g.gain.exponentialRampToValueAtTime(0.0008,s+0.03);
      nb.connect(g); g.connect(bp); nb.start(s); nb.stop(s+0.05);
    }
    fx({kind:'twinkle',i,x,y,c:col(i),dur:0.9,size:0.012});
  }
  function thunderRoll(ac,out,i){
    // tone = distance: closer is brighter AND louder
    const vv=vr(i), tn=P(rk(i),'tone'), t0=ac.currentTime+0.05;
    const dur=2.2+Math.random()*2.8*vv;
    const peak=(0.5+Math.random()*0.4*vv)*(0.55+0.45*tn);
    const n=mkNoise(ac);
    const lp=ac.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(160*tn,t0); lp.frequency.exponentialRampToValueAtTime(70*tn,t0+dur);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(peak,t0+0.18+Math.random()*0.5);
    g.gain.setTargetAtTime(0.0001,t0+0.8,dur*0.28);
    const roll=lfo(ac,0.9+Math.random()*0.8,peak*0.35,g.gain);   // sub-rolls inside the rumble
    n.connect(lp); lp.connect(g); g.connect(out);
    n.start(t0); n.stop(t0+dur+1.5);
    setTimeout(roll,(dur+1.6)*1000);
    fx({kind:'flash',i,x:0,y:0,c:[200,205,255],dur:1.3});
  }
  function drip(ac,out,i){
    const vv=vr(i), t0=ac.currentTime+0.03, f=(900+Math.random()*500*vv)*pt(i);
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(f,t0); o.frequency.exponentialRampToValueAtTime(f*0.35,t0+0.07);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(0.3,t0+0.004);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+0.12);
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*1.4-0.7;
    o.connect(g); g.connect(p); p.connect(out); o.start(t0); o.stop(t0+0.2);
    fx({kind:'ripple',i,x:0.08+Math.random()*0.84,y:0.3+Math.random()*0.4,c:col(i),dur:1.0,size:0.03});
  }
  function burble(ac,out){   // little up-chirps inside the stream noise
    const t0=ac.currentTime+0.02, f=380+Math.random()*250;
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(f,t0); o.frequency.exponentialRampToValueAtTime(f*2.1,t0+0.06);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(0.09,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+0.09);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0+0.15);
  }
  function gullCry(ac,out,i){
    const vv=vr(i), pp=pt(i), t0=ac.currentTime+0.05, cries=1+Math.floor(Math.random()*2);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500*pp; bp.Q.value=0.8;
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*1.4-0.7;
    bp.connect(p); p.connect(out);
    for(let k=0;k<cries;k++){
      const s=t0+k*(0.55+Math.random()*0.25), pv=pp*(1+(Math.random()-0.5)*0.25*vv);
      const o=ac.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(950*pv,s);
      o.frequency.linearRampToValueAtTime(1350*pv,s+0.12);
      o.frequency.exponentialRampToValueAtTime(700*pv,s+0.5);
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,s);
      g.gain.linearRampToValueAtTime(0.18,s+0.05);
      g.gain.setTargetAtTime(0.0001,s+0.3,0.1);
      o.connect(g); g.connect(bp); o.start(s); o.stop(s+0.7);
    }
    fx({kind:'bird',i,x:0.1+Math.random()*0.8,y:0.1+Math.random()*0.25,c:col(i),dur:1.4});
  }
  function buoyBell(ac,out,i){
    buildScale();   // tuned to the chosen key so it sits inside the drone/chimes world
    const t0=ac.currentTime+0.05;
    const f=(NOTES[0]?NOTES[0].freq:261.6)*0.75*(1+(Math.random()-0.5)*0.008);
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*0.8-0.4;
    lp.connect(p); p.connect(out);
    [[1,0.5],[2.0,0.18],[2.74,0.12],[4.07,0.06]].forEach(sp=>{
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*sp[0];
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(sp[1],t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0008,t0+3.5);
      o.connect(g); g.connect(lp); o.start(t0); o.stop(t0+3.8);
    });
    fx({kind:'ripple',i,x:0.15+Math.random()*0.7,y:0.72+Math.random()*0.15,c:col(i),dur:2.2,size:0.06});
  }
  function whaleCall(ac,out,i){
    const vv=vr(i), t0=ac.currentTime+0.05;
    const f0=(140+Math.random()*80*vv)*pt(i), dur=2.2+Math.random()*1.6*vv;
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(f0*2.4,t0+dur*0.45);
    o.frequency.exponentialRampToValueAtTime(f0*1.2,t0+dur);
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(0.32,t0+dur*0.3);
    g.gain.setTargetAtTime(0.0001,t0+dur*0.75,0.3);
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*1.0-0.5;
    o.connect(lp); lp.connect(g); g.connect(p); p.connect(out);
    o.start(t0); o.stop(t0+dur+1.2);
    fx({kind:'ripple',i,x:0.2+Math.random()*0.6,y:0.6+Math.random()*0.25,c:col(i),dur:3.2,size:0.12});
  }
  function pulsarPing(ac,out,i){
    buildScale();   // pings on the root two-and-a-half octaves up
    const t0=ac.currentTime+0.03, f=(NOTES[0]?NOTES[0].freq:261.6)*2.52;
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*0.8-0.4; p.connect(out);
    [[1,0.22],[2,0.06]].forEach(sp=>{
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*sp[0];
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(sp[1],t0+0.006);
      g.gain.exponentialRampToValueAtTime(0.0008,t0+0.5);
      o.connect(g); g.connect(p); o.start(t0); o.stop(t0+0.6);
    });
    fx({kind:'ripple',i,x:0.15+Math.random()*0.7,y:0.15+Math.random()*0.45,c:col(i),dur:1.1,size:0.035});
  }
  function whoosh(ac,out,i){
    const vv=vr(i), t0=ac.currentTime+0.05;
    const dur=2.6+Math.random()*1.6*vv, dir=Math.random()<0.5?1:-1;
    const n=mkNoise(ac);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
    bp.frequency.setValueAtTime(220,t0);
    bp.frequency.exponentialRampToValueAtTime(2400,t0+dur*0.5);
    bp.frequency.exponentialRampToValueAtTime(320,t0+dur);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(0.28,t0+dur*0.45);
    g.gain.linearRampToValueAtTime(0.0001,t0+dur);
    const p=ac.createStereoPanner();
    p.pan.setValueAtTime(-0.8*dir,t0); p.pan.linearRampToValueAtTime(0.8*dir,t0+dur);
    n.connect(bp); bp.connect(g); g.connect(p); p.connect(out);
    n.start(t0); n.stop(t0+dur+0.2);
    const y0=0.1+Math.random()*0.3;
    fx({kind:'streak',i,x:0,y:0,x0:dir>0?0.05:0.95,y0,x1:dir>0?0.95:0.05,y1:y0+0.15,c:col(i),dur});
  }
  function chimeDing(ac,out,i){
    const vv=vr(i);
    buildScale();
    const note=NOTES[Math.floor(Math.random()*NOTES.length)]||{freq:523};
    const f=note.freq*2*(Math.random()<0.15*vv?2:1), t0=ac.currentTime+0.05;
    const p=ac.createStereoPanner(); p.pan.value=Math.random()*1.4-0.7; p.connect(out);
    [[1,0.30],[2.76,0.10]].forEach(sp=>{
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*sp[0];
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(sp[1],t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0008,t0+2.4);
      o.connect(g); g.connect(p); o.start(t0); o.stop(t0+2.6);
    });
    fx({kind:'twinkle',i,x:0.15+Math.random()*0.7,y:0.1+Math.random()*0.5,c:col(i),dur:1.8});
  }
  function crackle(ac,out,i){
    const vv=vr(i), t0=ac.currentTime+0.03, nb=mkNoise(ac);
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800+Math.random()*1600*vv;
    const cg=ac.createGain(); cg.gain.setValueAtTime(0.0001,t0);
    cg.gain.linearRampToValueAtTime(0.10+Math.random()*0.20,t0+0.004);
    cg.gain.exponentialRampToValueAtTime(0.0008,t0+0.05+Math.random()*0.04);
    nb.connect(hp); hp.connect(cg); cg.connect(out);
    nb.start(t0); nb.stop(t0+0.12);
  }
  function heartBeat(ac,out,i){
    const thump=(s,vol)=>{
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(68,s); o.frequency.exponentialRampToValueAtTime(42,s+0.14);
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,s);
      g.gain.linearRampToValueAtTime(vol,s+0.015);
      g.gain.exponentialRampToValueAtTime(0.0008,s+0.22);
      o.connect(g); g.connect(out); o.start(s); o.stop(s+0.3);
    };
    const t0=ac.currentTime+0.06;
    thump(t0,1.0); thump(t0+0.30,0.6);
    fx({kind:'ripple',i,x:0.5,y:0.5,c:col(i),dur:0.9,size:0.3,lw:0.015});
  }

  // ── continuous musical layers (key-aware, snap to the key at next start) ──
  function droneMake(ac,out,i){
    const tone=P(rk(i),'tone'), move=P(rk(i),'move');
    buildScale();
    const f=(NOTES[0]?NOTES[0].freq:261.6)/2;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900*tone;
    const g=ac.createGain(); g.gain.value=0.8;
    lp.connect(g); g.connect(out);
    const oscs=[[f,'triangle',1],[f*1.5,'sine',0.55],[f*2,'sine',0.4],[f*1.006,'triangle',0.5]]
      .map(sp=>{ const o=ac.createOscillator(); o.type=sp[1]; o.frequency.value=sp[0];
        const og=ac.createGain(); og.gain.value=sp[2];
        o.connect(og); og.connect(lp); o.start(); return {o,og}; });
    const l1=lfo(ac,0.09,0.14*move,g.gain);
    return ()=>{ l1(); oscs.forEach(x=>{try{x.o.stop();x.o.disconnect();x.og.disconnect();}catch(e){}});
      try{lp.disconnect();g.disconnect();}catch(e){} };
  }
  function humMake(ac,out,i){
    const tone=P(rk(i),'tone'), move=P(rk(i),'move');
    buildScale();
    const f=Math.max(35,(NOTES[0]?NOTES[0].freq:261.6)/4);
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260*tone;
    const g=ac.createGain(); g.gain.value=0.9;
    lp.connect(g); g.connect(out);
    const specs=[[f,'sine',1],[f*1.5,'sine',0.3],[f*1.003,'sine',0.6]];
    if(f*0.5>28) specs.push([f*0.5,'sine',0.5]);
    const oscs=specs.map(sp=>{ const o=ac.createOscillator(); o.type=sp[1]; o.frequency.value=sp[0];
      const og=ac.createGain(); og.gain.value=sp[2];
      o.connect(og); og.connect(lp); o.start(); return {o,og}; });
    const l1=lfo(ac,0.05,0.18*move,g.gain);
    return ()=>{ l1(); oscs.forEach(x=>{try{x.o.stop();x.o.disconnect();x.og.disconnect();}catch(e){}});
      try{lp.disconnect();g.disconnect();}catch(e){} };

  function shimmerMake(ac,out,i){

  // ── audio follows the sliders (mute keeps the level but silences the layer) ──
  function setAudio(i){
    const Ld=LYS()[i], c=ch[i]; if(!Ld) return;
    const eff=c.m?0:c.v;
    const target=eff*Ld.level;
    if(eff>0.002 && !act[i]){
      if(!audioCtx||!masterGain) return;   // context is created on the touch (onCell)
      const g=audioCtx.createGain(); g.gain.value=0;
      const stop=Ld.make(audioCtx,g,i);
      g.connect(masterGain);
      act[i]={gain:g,stop(){ try{stop();}catch(e){} try{g.disconnect();}catch(e){} }};
      c.sent=-1;
    }
    if(!act[i]) return;
    if(Math.abs(target-c.sent)>0.0025){
      act[i].gain.gain.setTargetAtTime(target,audioCtx.currentTime,0.09);
      c.sent=target;
    }
    if(eff<=0.002){   // silent (off or muted): fade done → tear the nodes down
      if(!c.zeroAt) c.zeroAt=Date.now();
      else if(Date.now()-c.zeroAt>700){ const a=act[i]; act[i]=null; a.stop(); c.sent=-1; c.zeroAt=0; }
    } else c.zeroAt=0;
  }
  function killAudio(){
    ch.forEach((c,i)=>{ c.sent=-1; c.zeroAt=0;
      const a=act[i]; if(!a) return; act[i]=null;
      try{ a.gain.gain.setTargetAtTime(0,audioCtx.currentTime,0.1); }catch(e){}
      setTimeout(()=>a.stop(),600);
    });
  }
  // a changed tone/move takes effect by rebuilding the live layer (they're cheap)
  function rebuildLayer(key){
    const idx=LYS().findIndex(L=>L.key===key);
    if(idx<0||!act[idx]||!audioCtx) return;
    const a=act[idx]; act[idx]=null; ch[idx].sent=-1;
    try{ a.gain.gain.setTargetAtTime(0,audioCtx.currentTime,0.08); }catch(e){}
    setTimeout(()=>a.stop(),400);
    pokeSim();   // the frame loop recreates it at the current level
  }

  // ── per-scene mix memory: reopening a scene restores last time's sliders; the
  //    audio fades in at the first touch (a fresh page can't start sound itself) ──
  function saveMix(sc){
    if(SETTINGS.remember===false) return;
    const key=sc||SETTINGS.scene; if(!SCENES[key]) return;
    const m=(SETTINGS.mix&&typeof SETTINGS.mix==='object')?SETTINGS.mix:{};
    m[key]={v:ch.map(c=>+c.v.toFixed(3)),m:ch.map(c=>c.m?1:0)};
    SETTINGS.mix=m; mixRef=m; saveSettings();
  }
  function loadMix(){
    const rec=SETTINGS.remember!==false&&SETTINGS.mix?SETTINGS.mix[SETTINGS.scene]:null;
    mixRef=SETTINGS.mix;
    ch.forEach((c,i)=>{ c.v=rec&&rec.v?(rec.v[i]||0):0; c.m=!!(rec&&rec.m&&rec.m[i]);
      c.sent=-1; c.zeroAt=0; });
    refreshStrip();
  }

  // scene changes arrive from the panel, presets, or reset — one sync point
  function syncScene(){
    if(SETTINGS.scene===lastScene) return;
    if(!SCENES[SETTINGS.scene]) SETTINGS.scene='calm';
    if(lastScene&&SCENES[lastScene]) saveMix(lastScene);   // remember the outgoing mix
    lastScene=SETTINGS.scene;
    closeEditor();
    killAudio(); pools={}; fxq=[];
    buildBands(); restyle(); buildStrip();
    loadMix();
    pokeSim();
  }
  function restyle(){
    bandsEl.querySelectorAll('[data-cell]').forEach(d=>{

      // supplies the held/flash touch feedback

  // ── per-column control strip: 🔇 quick mute + 🎚 sound editor ──
  function buildStrip(){
    if(stripEl) stripEl.remove();
    stripEl=document.createElement('div'); stripEl.id='ssStrip';
    mBtns=[]; gBtns=[];
    LYS().forEach((Ld,i)=>{
      const cell=document.createElement('div'); cell.className='sscell';
      const m=document.createElement('button'); m.className='ssbtn ssmute'; m.title='Mute / unmute this sound';
      m.addEventListener('click',e=>{ e.stopPropagation(); getAudio(); toggleMute(i); });
      const g=document.createElement('button'); g.className='ssbtn ssgear'; g.textContent='🎚';
      g.title='Tune this sound';
      g.addEventListener('click',e=>{ e.stopPropagation(); getAudio(); openEditor(i); });
      cell.appendChild(m); cell.appendChild(g);
      stripEl.appendChild(cell);
      mBtns.push(m); gBtns.push(g);
    });
    stageEl.appendChild(stripEl);
    refreshStrip();
    if(lastLocked) gBtns.forEach(b=>b.style.display='none');
  }
  function refreshStrip(){
    LYS().forEach((Ld,i)=>{
      const m=mBtns[i]; if(!m) return;
      const cc=col(i);
      m.textContent=ch[i].m?'🔇':'🔊';
      m.classList.toggle('muted',!!ch[i].m);
      m.style.borderColor='rgba('+cc.join(',')+',0.55)';

    });

  // the sound editor card: every tuning slider for one sound, next to its column

    // stage - so the width to divide up is the stage's, not the window's.
    const W=stageEl.clientWidth, w=Math.min(320,W*0.92);
    let x=(i+0.5)/NCH*W-w/2; x=Math.max(8,Math.min(W-w-8,x));

  // ── visuals ──
  function alpha(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+Math.max(0,Math.min(1,a)).toFixed(3)+')'; }
  // The same tint as an OPAQUE colour: the background mixed k of the way toward
  // cc. Shared by the column wash and the slider body so the two cannot drift.
  function solidMix(cc,k){
    const r=bgRGB[0]*255*(1-k)+cc[0]*k, g=bgRGB[1]*255*(1-k)+cc[1]*k, b=bgRGB[2]*255*(1-k)+cc[2]*k;
    return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
  }
  // trail-fade fill, tinted per column: each slider sits in a wash of its own
  // colour (grey when muted), strongest at the foot and fading upward. The
  // strength is a Visuals setting — bold enough to read across the room by
  // default, with soft/off for students who need a calmer screen.
  // `k` is how far the column background is pulled toward the slider's colour;
  // `fill` is the strength of the slider's own body. Bold and Soft were 0.30/0.14
  // and 0.34/0.20 — a difference nobody could see across a room, so they are
  // pulled apart. `mono` is what makes OFF mean off: the column wash going away
  // was never the whole of it, because the slider itself still drew in its own
  // colour, and a setting called "Slider colours" that leaves the sliders
  // coloured is just wrong. Off now draws every slider in the same neutral grey.
  // `fill` ACCUMULATES: the slider body is redrawn over itself every frame on top
  // of a fade, so a bigger number does not mean a stronger colour, it means the
  // column reaches white sooner. 0.34 and 0.20 both saturated, which is exactly
  // why Bold and Soft looked the same. The difference now lives in `k`, the depth
  // of the column wash, and `fill` stays inside the range where a slider still
  // reads as its own colour rather than as a white bar.
  // Now that the body is drawn with `lighten` against an opaque tint instead of
  // accumulating, `fill` finally means what it says: the fraction of the way
  // from the background to the layer's own colour that the slider ends up. The
  // old numbers were tuned against an accumulation that overshot them badly, so
  // they read far too dark once that was taken away.
  const WASH={ bold:{label:'Bold',k:0.42,fill:0.62},
               soft:{label:'Soft',k:0.10,fill:0.26},
               off :{label:'Off', k:0,   fill:0,    mono:true} };
  function wash(){ return WASH[SETTINGS.colWash]||WASH.bold; }
  function drawColBg(W,H){
    const n=LYS().length, cw=W/n, k0=wash().k;
    const rgbOf=(cc,k)=>[ bgRGB[0]*255*(1-k)+cc[0]*k,
                          bgRGB[1]*255*(1-k)+cc[1]*k,
                          bgRGB[2]*255*(1-k)+cc[2]*k ];
    const mix  =(cc,k)=>{ const c=rgbOf(cc,k); return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+',0.18)'; };
    const solid=solidMix;
    if(k0===0){
      // Wash OFF is a plain fade to the background, and 8-bit compositing on an
      // accelerated canvas rounds: alpha 0.18 floors at 2, so without help the
      // canvas settles on rgb(2,2,2) rather than black. Burn one level off, then
      // clamp back up to the background.
      const br=bgRGB[0]*255|0, bg2=bgRGB[1]*255|0, bb=bgRGB[2]*255|0;
      ctx.fillStyle='rgba('+br+','+bg2+','+bb+',0.18)';
      ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='color-burn';
      ctx.fillStyle='rgb(254,254,254)';
      ctx.fillRect(0,0,W,H);
      if(br||bg2||bb){
        ctx.globalCompositeOperation='lighten';
        ctx.fillStyle='rgb('+br+','+bg2+','+bb+')';
        ctx.fillRect(0,0,W,H);
      }
      ctx.globalCompositeOperation='source-over';
      return;
    }
    // The tinted branch has the SAME stall, and it was left with it on the
    // reasoning that a burn pass would fight the colour wash. It does not, as
    // long as what the burn is clamped back up to is the wash itself rather
    // than the background: the fade heads for the tint, the burn guarantees it
    // keeps moving, and a `lighten` at the tint stops it going past. Measured
    // before this: where the animation had been sat 10 levels above the wash at
    // Bold and 5 at Soft, for ever — the ghost image on the canvas.
    const ramp=(k,solid)=>{
      const g=ctx.createLinearGradient(0,H,0,0);
      g.addColorStop(0,   solid[0]); g.addColorStop(0.55, solid[1]); g.addColorStop(1, solid[2]);
      return g;
    };
    const stops=[];
    for(let i=0;i<n;i++){
      const muted=ch[i].m, cc=muted?GREY:col(i), k=muted?k0*0.3:k0;
      stops.push({ fade:[mix(cc,k),mix(cc,k*0.30),mix(cc,k*0.06)],
                   solid:[solid(cc,k),solid(cc,k*0.30),solid(cc,k*0.06)] });
      ctx.fillStyle=ramp(k,stops[i].fade); ctx.fillRect(i*cw,0,cw+1,H);
    }
    ctx.globalCompositeOperation='color-burn';
    ctx.fillStyle='rgb(254,254,254)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighten';
    for(let i=0;i<n;i++){ ctx.fillStyle=ramp(0,stops[i].solid); ctx.fillRect(i*cw,0,cw+1,H); }
    ctx.globalCompositeOperation='source-over';
  }
  const VIS={
    rain(i,p,c,W,H,dt,I){
      const q=activeQuality(), cap=(q==='high'?150:q==='med'?90:45)*p.den;
      const pl=pool(i);
      for(let k=0;k<I*8*p.den&&pl.length<cap;k++)
        pl.push({x:Math.random()*W,y:-20,v:(0.55+Math.random()*0.5)*H*p.sp,l:H*(0.028+Math.random()*0.03)*(p.len||1)});
      ctx.strokeStyle=alpha(c,p.a*I); ctx.lineWidth=Math.max(1,H*0.0016);
      ctx.beginPath();
      pools[i]=pl.filter(d=>{ d.y+=d.v*dt;
        if(d.y>H+20) return false;
        ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-d.l*0.12,d.y+d.l); return true; });
      ctx.stroke();
    },
    waves(i,p,c,W,H,dt,I){
      for(let b=0;b<2;b++){
        const yc=H*(p.y+b*0.07), amp=H*0.025*I*(1+b*0.4);
        ctx.strokeStyle=alpha(c,p.a*I*(1-b*0.3));
        ctx.lineWidth=p.thin?H*0.006:H*0.02;
        ctx.beginPath();
        for(let k=0;k<=24;k++){ const xt=k/24;
          const y=yc+Math.sin(xt*4.5+t*(0.5+b*0.2)+b*2)*amp;
          if(k===0) ctx.moveTo(xt*W,y); else ctx.lineTo(xt*W,y); }
        ctx.stroke();
      }
    },
    lines(i,p,c,W,H,dt,I){
      for(let b=0;b<3;b++){
        const yc=H*(p.y+b*0.18), amp=H*0.02*(1+b*0.3);
        ctx.strokeStyle=alpha(c,(0.04+p.a*I)*(1-b*0.2));
        ctx.lineWidth=H*0.008;
        ctx.beginPath();
        for(let k=0;k<=24;k++){ const xt=k/24;
          const y=yc+Math.sin(xt*p.f+t*(0.35+b*0.12)+b*2.4)*amp;
          if(k===0) ctx.moveTo(xt*W,y); else ctx.lineTo(xt*W,y); }
        ctx.stroke();
      }
    },
    fire(i,p,c,W,H,dt,I){
      const flick=0.75+0.25*Math.sin(t*9+Math.sin(t*23)*2);
      const g=ctx.createRadialGradient(W/2,H*1.05,0,W/2,H*1.05,H*0.55);
      g.addColorStop(0,alpha(c,0.30*I*flick)); g.addColorStop(1,alpha(c,0));
      ctx.fillStyle=g; ctx.fillRect(0,H*0.4,W,H*0.6);
      const pl=pool(i), cap=activeQuality()==='low'?30:80;
      for(let k=0;k<I*2&&pl.length<cap;k++)
        pl.push({x:W/2+(Math.random()-0.5)*W*0.35,y:H,vy:-(0.12+Math.random()*0.22)*H,life:1,s:Math.random()*10});
      pools[i]=pl.filter(s=>{ s.y+=s.vy*dt; s.x+=Math.sin(t*6+s.s)*H*0.05*dt; s.life-=dt*0.55;
        if(s.life<=0) return false;
        ctx.fillStyle=alpha(c,s.life*0.5*I);
        ctx.beginPath(); ctx.arc(s.x,s.y,Math.max(1.5,H*0.003),0,Math.PI*2); ctx.fill(); return true; });
    },
    // One radial gradient, dead centre, never moving. Two things were wrong with
    // it. A large low-alpha radial re-stamped every frame quantises into visible
    // concentric RINGS — the same 8-bit arithmetic as the wash, but arranged in
    // circles — and a circle that only breathes in and out reads as a flat disc
    // rather than as something alive. It is three slow lobes now, drifting on
    // cycles that do not divide into one another, so they never re-form the same
    // shape; overlapping offset gradients also have no common centre for a ring
    // to form around. The sub-pixel jitter is what clears the last of it: the
    // 8-bit steps land somewhere different every frame and average out.
    // A drifting field of static, and DELIBERATELY not a gradient.
    //
    // This was a big soft radial for a long time and it could not be made to
    // look right. Re-stamped every frame on a fading canvas, its 8-bit rounding
    // lands identically every frame, so the quantisation steps pin in place and
    // build into concentric rings — the same arithmetic as the slider body,
    // arranged in circles. Three goes at it: separating the stops, drifting
    // lobes, jittering the radius. Each helped and none of them fixed it, and
    // one of them blew Deep water out badly enough that the rings got worse.
    //
    // The way to not have that problem is to have no gradient. These are
    // individual specks at random positions, and the softness at the edge is a
    // fall-off in their DENSITY rather than in their alpha — nothing is being
    // interpolated across a large area, so there is nothing to quantise and no
    // contour can form however long it runs. It reads as a quiet shimmer, which
    // is what a drone, a deep-water hum and a space hum should look like.
    glow(i,p,c,W,H,dt,I){
      const cx=W/2, cy=H*p.cy, R=Math.min(W,H)*p.r*1.45;
      const q=activeQuality();
      const n=Math.round((q==='high'?620:q==='med'?380:190)*(0.2+0.8*I));
      ctx.fillStyle=alpha(c,Math.min(0.9,p.a*I*4.2));
      for(let k=0;k<n;k++){
        // radius as u^0.62 rather than sqrt(u): denser toward the middle, thinning
        // out to nothing at the rim, so the field has an edge without an outline
        const rr=R*Math.pow(Math.random(),0.62), th=Math.random()*Math.PI*2;
        const x=cx+Math.cos(th)*rr, y=cy+Math.sin(th)*rr;
        if(x<0||y<0||x>=W||y>=H) continue;
        const sz=1+(Math.random()<0.30?2.2:0.5);
        ctx.fillRect(x|0,y|0,sz,sz);
      }
    },
    bubbles(i,p,c,W,H,dt,I){
      const pl=pool(i), cap=activeQuality()==='low'?18:36;
      for(let k=0;k<I*1.5&&pl.length<cap;k++)
        pl.push({x:Math.random()*W,y:H+5,r:H*(0.003+Math.random()*0.005),v:(0.05+Math.random()*0.08)*H,ph:Math.random()*7});
      const lim=H*(1-p.top);
      ctx.lineWidth=Math.max(1,H*0.002);
      pools[i]=pl.filter(b=>{
        b.y-=b.v*dt; b.x+=Math.sin(t*2+b.ph)*H*0.02*dt;
        if(b.y<lim) return false;
        const fade=Math.min(1,(b.y-lim)/(H*0.06));
        ctx.strokeStyle=alpha(c,p.a*I*fade);
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke(); return true;
      });
    },
    stars(i,p,c,W,H,dt,I){
      let pl=pool(i);
      if(pl.length!==p.n){ pl=pools[i]=[];
        for(let k=0;k<p.n;k++) pl.push({x:Math.random(),y:Math.random()*0.75,ph:Math.random()*7,s:0.7+Math.random()*0.6}); }
      for(const s of pl){
        if(p.drift){ s.x+=p.drift*dt; if(s.x>1) s.x-=1; }
        const a=I*0.5*(0.35+0.65*(0.5+0.5*Math.sin(t*p.tw*s.s+s.ph)));
        ctx.fillStyle=alpha(c,a);
        const r=Math.max(1,H*0.0022*s.s);
        ctx.fillRect(s.x*W-r/2,s.y*H-r/2,r,r);
      }
    },
  };
  function drawFx(W,H,dt){
    fxq=fxq.filter(f=>{
      f.age+=dt/(f.dur||1);
      if(f.age>=1) return false;
      const cc=ch[f.i];
      const lvl=cc?Math.max(0.2,cc.m?0:cc.v):0.6;
      if(lvl<=0) return false;   // muted mid-flight: let its visuals go too
      const a=(1-f.age)*lvl, x=(f.x||0)*W, y=(f.y||0)*H;
      if(f.kind==='twinkle'){
        const r=H*(f.size||0.014)*(1-f.age*0.5);
        ctx.strokeStyle=alpha(f.c,a*0.8); ctx.lineWidth=Math.max(1,H*0.0025);
        ctx.beginPath();
        ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r);
        ctx.stroke();
      } else if(f.kind==='bird'){
        const bx=x+f.age*W*0.06, by=y-f.age*H*0.05;
        ctx.strokeStyle=alpha(f.c,a*0.7); ctx.lineWidth=Math.max(1.5,H*0.004);
        const w=H*0.012*(1+Math.sin(f.age*25)*0.4);
        ctx.beginPath(); ctx.moveTo(bx-w,by); ctx.quadraticCurveTo(bx,by-w,bx,by);
        ctx.quadraticCurveTo(bx,by-w,bx+w,by); ctx.stroke();
      } else if(f.kind==='ripple'){
        const r=H*(f.size||0.05)*(0.25+f.age*1.6);
        ctx.strokeStyle=alpha(f.c,a*0.5); ctx.lineWidth=Math.max(1,H*(f.lw||0.004)*(1-f.age*0.6));
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
      } else if(f.kind==='flash'){
        const k=f.age<0.12?f.age/0.12:1-(f.age-0.12)/0.88;
        ctx.fillStyle=alpha(f.c,k*0.12*lvl); ctx.fillRect(0,0,W,H);
      } else if(f.kind==='streak'){
        const px=(f.x0+(f.x1-f.x0)*f.age)*W, py=(f.y0+(f.y1-f.y0)*f.age)*H;
        const tx=px-(f.x1-f.x0)*W*0.12, ty=py-(f.y1-f.y0)*H*0.12;
        const g=ctx.createLinearGradient(tx,ty,px,py);
        g.addColorStop(0,alpha(f.c,0)); g.addColorStop(1,alpha(f.c,a*0.8));
        ctx.strokeStyle=g; ctx.lineWidth=Math.max(1.5,H*0.004);
        ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(px,py); ctx.stroke();
        ctx.fillStyle=alpha(f.c,a);
        ctx.beginPath(); ctx.arc(px,py,Math.max(1.5,H*0.003),0,Math.PI*2); ctx.fill();
      }
      return true;
    });
  }
  // the slider readout: a glowing fill up to the level + a bright handle bar.
  // Muted channels keep their height but go dim and grey — "still set, silenced".
  function drawLevels(W,H,held){
    const LY=LYS(), n=LY.length, cw=W/n;
    for(let i=0;i<n;i++){
      const Ld=LY[i]; if(!Ld) continue;
      const v=ch[i].v, muted=ch[i].m, cc=wash().mono ? GREY : col(i);
      if(v<=0.004 && !held.has(i)) continue;
      const x0=i*cw+cw*0.05, w=cw*0.90;
      const yTop=(1-(LVL0+v*LVLR))*H;
      const fa=wash().fill, mono=wash().mono;
      // OFF draws no body at all — just the line at the top, faintly. The point
      // of turning colours off is to see the scene BEHIND the sliders, and a
      // grey column in front of it defeats that as thoroughly as a coloured one.
      if(v>0.004 && !mono){
        // Drawn with `lighten` against an OPAQUE tint rather than stacked on as
        // one more translucent layer. A body that accumulates settles at
        // whatever equilibrium the fade happens to leave, and that quantises to
        // 8-bit at slightly different levels down the gradient — which is the
        // horizontal banding that made the slider look patchy. Lighten gives the
        // same result every frame, so the gradient is smooth and no longer
        // depends on the frame rate.
        const grad=ctx.createLinearGradient(0,yTop,0,H);
        grad.addColorStop(0,solidMix(cc,muted?fa*0.25:fa));
        grad.addColorStop(1,solidMix(cc,muted?fa*0.05:fa*0.2));
        ctx.save();
        ctx.globalCompositeOperation='lighten';
        ctx.fillStyle=grad; ctx.fillRect(x0,yTop,w,H*(1-LVL0*0.6)-yTop);
        ctx.restore();
      }
      const hc=muted?GREY:cc;
      const glowA=mono?(muted?0.04:0.07):(muted?0.12:0.30);
      const capA =mono?(held.has(i)?0.70:(muted?0.16:0.34))
                      :(held.has(i)?1:(muted?0.5:0.9));
      ctx.fillStyle=alpha(hc,glowA); ctx.fillRect(x0,yTop-H*0.011,w,H*0.022);
      ctx.fillStyle=alpha(hc,capA);  ctx.fillRect(x0,yTop-H*0.0035,w,H*0.007);
    }
  }

      el.appendChild(makeSlider({key:'volume',label:'Volume',min:0,max:1,step:0.01,dp:2}));
      const wh=document.createElement('div'); wh.className='sectn'; wh.textContent='Winding down'; el.appendChild(wh);
      el.appendChild(makeSlider({key:'wind',label:'🌙 Wind-down time (seconds)',min:2,max:20,step:0.5,dp:1}));
    },
    // ✨ Visuals tab
    buildVisuals(el){
      el.appendChild(makeChips('Slider colours','colWash',WASH,pokeSim));
      el.appendChild(makeToggle('Moving pictures with the sounds','visFx'));
      el.appendChild(makeToggle('Icons under the sliders','showLabels',()=>{ buildBands(); restyle(); }));
      appendBgControl(el);
    },
    onCell(colIdx){
      getAudio(); pokeSim(); windOn=false;   // a touch always cancels the wind-down
      const p=pointers.find(q=>q.down&&q.col===colIdx);
      if(p&&colIdx<LYS().length){
        const lv=yToLevel(p.y);
        if(lv>0) ch[colIdx].v=lv;   // touches in the strip zone belong to the buttons
      }
    },
    init(cv){
      ctx=cv.getContext('2d');
      // the mixer is always 8 slider columns in a single row
      SETTINGS.mode='notes'; SETTINGS.yAxis='none'; SETTINGS.noteCount=8;
      // One-time rescue when upgrading from the old tile version: a stray Mute
      // or zeroed volume left in its saved settings silences the new mixer too.
      if(SETTINGS.ssv!==2){ SETTINGS.ssv=2; SETTINGS.mute=false;
        if(!(SETTINGS.volume>=0.05)) SETTINGS.volume=0.3; }
      // The resume on touch RELEASE that used to live here (touchstart is not a
      // user activation) is now framework.js's wakeAudio(), for every app.
      window.addEventListener('beforeunload',()=>saveMix());
      saveSettings(); refreshMusic();
      syncScene();
      this.reset();
    },
    resize(w,h){ this.reset(); },
    splat(){},
    frame(dt){
      if(!ctx) return;
      syncScene();
      if(SETTINGS.mix!==mixRef) loadMix();   // a loaded preset brought its own mix
      // session lock hides the tune buttons (students keep the quick mutes)
      if(!!SETTINGS.locked!==lastLocked){
        lastLocked=!!SETTINGS.locked;
        gBtns.forEach(b=>b.style.display=lastLocked?'none':'');
        if(lastLocked) closeEditor();
      }
      const first=bandsEl.firstChild;
      if(first&&!first._ss) restyle();
      t+=dt;
      const W=canvas.width,H=canvas.height;
      // 🌙 wind-down glides every slider toward 0; a touch overrides its column
      if(windOn){
        let all0=true;
        ch.forEach(c=>{ c.v=Math.max(0,c.v-dt/Math.max(1,SETTINGS.wind)); if(c.v>0) all0=false; });
        if(all0){ windOn=false; saveMix(); }
      }
      const held=new Set(), live=new Set(); let anyDown=false;
      for(const p of pointers){
        if(!p.down) continue;
        anyDown=true; windOn=false; live.add(p.id);
        let tr=ptrack[p.id];
        // touches that START in the strip zone are for the buttons — ignore them
        // until they clearly become an upward drag into the slider range
        if(!tr) tr=ptrack[p.id]={skip:yToLevel(p.y)===0};
        const i=p.col;
        if(i<0||i>=LYS().length) continue;
        if(tr.skip){
          if(yToLevel(p.y)>0.1) tr.skip=false; else continue;
        }
        held.add(i);
        ch[i].v=yToLevel(p.y);
        if(ch[i].v>0&&ch[i].m){ ch[i].m=false; dimIcon(i); refreshStrip(); }   // moving a muted slider unmutes it
      }
      let lifted=false;
      for(const id in ptrack) if(!live.has(id)){ delete ptrack[id]; lifted=true; }
      if(lifted) saveMix();   // a lift is the natural moment to remember the mix
      ch.forEach((c,i)=>setAudio(i));
      // draw
      ctx.globalCompositeOperation='source-over';
      drawColBg(W,H);
      let busy=anyDown||windOn||fxq.length>0;
      const LY=LYS();
      ctx.globalCompositeOperation='lighter';
      if(SETTINGS.visFx!==false){
        LY.forEach((Ld,i)=>{ const c=ch[i], ev=c.m?0:c.v;
          if(c.v>0.01) busy=true;
          if(ev>0.01&&Ld.vis) VIS[Ld.vis.k](i,Ld.vis,col(i),W,H,dt,ev); });
        drawFx(W,H,dt);
      } else { fxq=[]; LY.forEach((Ld,i)=>{ if(ch[i].v>0.01) busy=true; }); }
      drawLevels(W,H,held);
      ctx.globalCompositeOperation='source-over';
      if(busy) pokeSim();
    },
    reset(){
      if(!ctx) return;
      pools={}; fxq=[];
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    },
  };
})();
/* ===== ANIMATION END ===== */

boot();
</script>
