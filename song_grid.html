<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Song Grid – Music Room</title>
<link rel="stylesheet" href="framework.css">
</head>
<body>
<script src="framework.js"></script>
<script src="songs.js"></script>
<script>
'use strict';
/* ===== ANIMATION START =====
   Song Grid — follow-along song player. The note grid lights the next note of a
   song; the student plays the whole tune by pressing lit cells at their own pace
   (Follow along), or watches/listens as it autoplays (Listen). Songs are stored
   movable-do (column indices into the current scale), so the Starting note and
   Register controls transpose everything automatically.

   Menu: 🎵 Songs (song/mode/speed/repeat) · 🎸 Instrument (tuning + voice/effects)
   · ✨ Visuals · ⭐ Presets.

   Visual philosophy (therapist feedback): everything visual lives ON the keys —
   a key colour palette and a CSS press effect (bloom/smoke/pixelate/ripple) that
   fires inside the pressed key on every press, like an instrument's skin. No
   painting, no canvas rewards, nothing that competes with the grid for attention.
*/
const Anim = (() => {

  const SONGS = window.MUSIC_SONGS;   // shared library — see songs.js
  const PLAY_OPTS={follow:{label:'👆 Follow along'},listen:{label:'👂 Listen'}};
  const SG_SCALES={major:{label:'Major (do-re-mi)'},minor:{label:'Minor'}};
  const KEY_THEMES={
    boom:  {label:'🌈 Boomwhacker'},
    prism: {label:'💎 Prism'},
    pastel:{label:'🌸 Pastel'},
    ocean: {label:'🌊 Ocean'},
    mono:  {label:'⚪ Mono'},
  };
  const CELEB_OPTS={wave:{label:'🌈 Gentle wave'},none:{label:'Off'}};
  const PULSE_OPTS={gentle:{label:'Gentle'},strong:{label:'Strong'},steady:{label:'Steady (no motion)'}};

  let pos=0, playing=false, wait=0, celebrating=false;
  let progEl=null, ctx=null;

  function song(){ return SONGS[SETTINGS.song]||SONGS.twinkle; }
  function beatSecs(b){ return b*(60/song().bpm)/(SETTINGS.tempo||1); }
  function cellEl(c){ return document.querySelector('[data-cell="'+c+'-0"]'); }
  function setProgress(){ if(progEl) progEl.style.width=(pos/song().notes.length*100)+'%'; }
  function applyGuideLook(){
    bandsEl.dataset.pulse=SETTINGS.guidePulse||'gentle';
    bandsEl.classList.toggle('spotlight', !!SETTINGS.spotlight && SETTINGS.playMode==='follow' && !celebrating);
  }
  function updateTarget(){
    document.querySelectorAll('.band.target').forEach(d=>d.classList.remove('target'));
    setProgress(); applyGuideLook();
    if(celebrating || SETTINGS.playMode!=='follow' || pos>=song().notes.length) return;
    const d=cellEl(song().notes[pos][0]); if(d) d.classList.add('target');
  }

  // ── key colour palettes (Anim.bandColor overrides the framework's Boomwhacker) ──
  function hslRGB(h,s,l){
    const f=n=>{ const k=(n+h*12)%12, a=s*Math.min(l,1-l);
      return Math.round((l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255); };
    return [f(0),f(8),f(4)];
  }
  function lerp3(a,b,t){ return [0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t)); }
  function boomBase(i){
    const pc=NOTES[i]?NOTES[i].pc:0;
    if(BOOMWHACKER[pc]) return BOOMWHACKER[pc];
    return (BOOMWHACKER[(pc+11)%12]||[200,200,200]).map(v=>Math.round(v*0.7));
  }
  function keyColor(i){
    const n=Math.max(1,NOTES.length-1), t=NOTES.length>1?i/n:0;
    switch(SETTINGS.keyTheme){
      case 'prism':  return hslRGB(t*0.85,0.9,0.62);
      case 'pastel': return boomBase(i).map(v=>Math.round(v+(255-v)*0.55));
      case 'ocean':  return t<0.5 ? lerp3([15,70,150],[25,150,175],t*2) : lerp3([25,150,175],[120,230,215],(t-0.5)*2);
      case 'mono':   return [1,1,1].map(()=>Math.round(245-t*95));
      default:       return null;   // Boomwhacker (framework)
    }
  }

  function playCol(col){
    pluckNote((col+0.5)/song().span, 0.5, 1);
    flashCell(col,0); fxCell(col,0);   // press effect is a framework helper now
  }
  function applySong(){
    stopListen();
    if(song().scaleHint && SG_SCALES[song().scaleHint]) SETTINGS.scale=song().scaleHint;
    SETTINGS.noteCount=song().span;
    SETTINGS.yAxis='none'; SETTINGS.mode='notes';
    saveSettings(); refreshMusic();
    pos=0; celebrating=false;
    updateTarget();
  }
  function stopListen(){ playing=false; refreshRailButtons(); }
  function startListen(){
    if(pos>=song().notes.length) pos=0;
    playing=true; wait=0.4; getAudio(); pokeSim(); updateTarget(); refreshRailButtons();
  }
  function finishSong(){
    celebrating=true; playing=false; updateTarget(); setProgress();
    const s=song().span;
    let endAt=1200;
    if((SETTINGS.celebration||'wave')==='wave'){
      for(let i=0;i<s;i++) setTimeout(()=>{ fxCell(i,0); flashCell(i,0); pluckNote((i+0.5)/s,0.5,0.5); }, 350+i*130);
      endAt=350+s*130+1200;
    }
    setTimeout(()=>{
      celebrating=false; pos=0; setProgress();
      if(SETTINGS.loopSong && SETTINGS.playMode==='listen') startListen();
      updateTarget(); refreshRailButtons();
    }, endAt);
  }

  return {
    appLabel:'🎵 Song',
    sectionLabel:'Song Grid',
    lockMode:'notes',
    hideRail:['clear'],
    themes:{ glow:{label:'✨ Glow', colors:[[1,0.9,0.4],[0.5,1,0.7],[0.4,0.8,1],[1,0.6,0.8],[0.8,0.7,1]]} },
    defaults:{ theme:'glow', song:'twinkle', playMode:'follow', tempo:1.0, loopSong:false,
      keyTheme:'boom', pressFx:'none', celebration:'wave', spotlight:false, guidePulse:'gentle',
      mode:'notes', paint:false, yAxis:'none', zoneLook:'tint', scale:'major',
      colorMode:'note', noteCount:6 },
    schema:[],
    bandColor:keyColor,
    railButtons:[
      { id:'sgplay', label:'Play',
        icon:()=> SETTINGS.playMode==='listen' ? (playing?'⏸':'▶') : '⏮',
        title:()=> SETTINGS.playMode==='listen' ? (playing?'Pause the song':'Play the song')
                                                : 'Restart the song from the beginning',
        active:()=>playing,
        onClick(){
          if(SETTINGS.playMode==='listen'){ playing ? stopListen() : startListen(); }
          else { pos=0; celebrating=false; updateTarget(); }
        }},
    ],
    // 🎵 Songs tab — just the session controls
    // The app's own tab. Everything here is what THIS app is; none of it is
    // Register/Scale/Starting note, which is all the Notes tab holds now.
    // See PHASE-4E-APP-TAB.md.
    buildApp(el){
      el.appendChild(makeChips('Song','song',SONGS,applySong));
      el.appendChild(makeChips('How it plays','playMode',PLAY_OPTS,()=>{
        stopListen(); pos=0; buildAppPanel(); updateTarget(); }));
      if(SETTINGS.playMode==='listen')
        el.appendChild(makeSlider({key:'tempo',label:'Speed',min:0.4,max:1.6,step:0.05,dp:2}));
      el.appendChild(makeToggle('Repeat when finished','loopSong'));
      el.appendChild(makeSongImportUI(()=>{ applySong(); buildAppPanel(); }));
    },
    // 🎼 Notes — the same in every app.
    buildInstrument(el){
      appendTuning(el,refreshMusic,{scales:SG_SCALES,heading:false});
    },
    // 🎸 Instrument tab — tuning on top of the framework's voice/effects/volume
    // ✨ Visuals tab — the look and feel of the keys themselves
    buildVisuals(el){
      el.appendChild(makeChips('Key colours','keyTheme',KEY_THEMES,buildBands));
      el.appendChild(makeChips('When the song is finished','celebration',CELEB_OPTS));
      el.appendChild(makeToggle('Spotlight the next note','spotlight',applyGuideLook));
      el.appendChild(makeChips('Next-note pulse','guidePulse',PULSE_OPTS,applyGuideLook));
      el.appendChild(makeToggle('Note letters on screen','showLabels',buildBands));
      appendBgControl(el);
      el.appendChild(makeChips('When a key is pressed','pressFx',PRESSFX_OPTS));
    },
    onCell(col,row){
      fxCell(col,0);   // the key responds to every press, like a real instrument
      if(celebrating || SETTINGS.playMode!=='follow') return;
      const notes=song().notes;
      if(pos<notes.length && col===notes[pos][0]){
        pos++;
        if(pos>=notes.length) finishSong(); else updateTarget();
      }
    },
    init(cv){
      ctx=cv.getContext('2d');
      if(!document.getElementById('sgCss')){
        const st=document.createElement('style'); st.id='sgCss';
        st.textContent=
          '.band.target{outline:3px solid rgba(255,255,255,0.95);outline-offset:-4px;'+
            'background:rgba(var(--c),0.30)!important;animation:sgPulse 1.1s ease-in-out infinite}'+
          '@keyframes sgPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.9)}}'+
          '#bands[data-pulse="strong"] .band.target{animation-duration:0.65s}'+
          '#bands[data-pulse="steady"] .band.target{animation:none;filter:brightness(1.55)}'+
          '#bands.spotlight .band{opacity:0.22;transition:opacity 0.25s}'+
          '#bands.spotlight .band.target,#bands.spotlight .band.held,'+
          '#bands.spotlight .band.flash,#bands.spotlight .band.bloom{opacity:1}'+
          '#sgProgress{position:fixed;top:0;left:0;height:6px;width:0;z-index:6;'+
            'background:linear-gradient(90deg,#f5d117,#3bb54a,#1ca9a9);border-radius:0 3px 3px 0;'+
            'transition:width 0.25s;pointer-events:none}';
        document.head.appendChild(st);
      }
      if(!progEl){ progEl=document.createElement('div'); progEl.id='sgProgress'; stageEl.appendChild(progEl); }
      this.reset();
      applySong();
    },
    resize(w,h){ this.reset(); },   // a 2D canvas clears when resized
    splat(){},                      // no painting in this app
    frame(dt){
      // the canvas is just the solid background; all visuals live on the keys (DOM/CSS)
      if(ctx){
        ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')';
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }
      // Listen-mode scheduler (frame-driven; pokeSim keeps the loop awake while playing)
      if(playing){
        pokeSim();
        wait-=dt;
        while(playing && wait<=0){
          const notes=song().notes;
          const c=notes[pos][0], b=notes[pos][1];
          playCol(c);
          pos++; setProgress();
          wait+=beatSecs(b);
          if(pos>=notes.length){ playing=false; setTimeout(finishSong, beatSecs(b)*1000); }
        }
      }
    },
    reset(){
      if(!ctx) return;
      ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    },
  };
})();
/* ===== ANIMATION END ===== */

boot();
</script>
</body>
</html>
